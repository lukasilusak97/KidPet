<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ježko</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen app — status meters on top, Ježko's home in the middle (five rooms: each room's furniture triggers its own care action), room tabs at the bottom. Shop, games, trips and album open as panels over the room. Single deliberate warm, toy-like look; night is an in-game state. */
:root {
  --sky-top: #bfe6f5;
  --sky-bottom: #eaf7e4;
  --night-top: #1d2a4d;
  --night-bottom: #3c4f7a;
  --ink: #3a2618;
  --paper: #fffaf0;
  --bark: #8a5a3b;
  --berry: #e2504c;
  --sun: #ffc83d;
  --leaf: #4f9a3a;
  --soft: #f3e6cf;
  --sea: #5aa7e0;
  --font: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky-bottom); color: var(--ink); font-family: var(--font);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overflow: hidden;
}
button { font-family: inherit; color: var(--ink); }
.app {
  height: 100%; display: grid; grid-template-rows: auto 1fr auto; max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; gap: 10px; box-sizing: border-box;
}

/* ---------- top bar ---------- */
.top { display: grid; gap: 8px; }
.titlebar { display: flex; align-items: center; gap: 6px; }
.titlebar h1 { margin: 0; font-size: 1.9rem; font-weight: 800; line-height: 1; color: var(--bark); flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; background: var(--paper); border: 3px solid var(--bark);
  border-radius: 999px; padding: 2px 12px; font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums;
}
.chip.bump { animation: bump .4s; }
@keyframes bump { 50% { transform: scale(1.25); } }
.iconbtn {
  font-size: 1.3rem; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--bark);
  background: var(--paper); cursor: pointer; padding: 0; display: grid; place-items: center; flex: none;
}
.iconbtn:disabled { opacity: .45; cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.meter { background: var(--paper); border: 3px solid var(--bark); border-radius: 14px; padding: 4px 8px 6px; display: grid; gap: 2px; min-width: 0; }
.meter .lbl { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: .9rem; white-space: nowrap; overflow: hidden; }
.meter .lbl b { font-size: 1.1rem; }
.bar { height: 12px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; width: 50%; border-radius: 99px; background: var(--leaf); transition: width .4s, background-color .4s; }
.bar i.mid { background: var(--sun); }
.bar i.low { background: var(--berry); animation: blinkbar 1s infinite; }
@keyframes blinkbar { 50% { opacity: .45; } }
.progress { font-size: .95rem; font-weight: 700; text-align: center; color: var(--bark); }

/* ---------- scene & rooms ---------- */
.scene {
  position: relative; border-radius: 24px; overflow: hidden; min-height: 0; container-type: inline-size;
  background: var(--soft); border: 4px solid var(--bark); touch-action: none;
}
.room, .pvroom { position: absolute; inset: 0; }
.wall { position: absolute; left: 0; right: 0; top: 0; height: 64%; }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 36%; box-shadow: inset 0 14px 16px -10px rgba(58,38,24,.35); }
.baseboard { position: absolute; left: 0; right: 0; bottom: 36%; height: 9px; background: var(--paper); border-top: 2px solid rgba(58,38,24,.25); border-bottom: 3px solid rgba(58,38,24,.4); }
.furn { position: absolute; transform: translateX(-50%); line-height: 1; border: 0; background: none; padding: 0; cursor: pointer; filter: drop-shadow(0 3px 0 rgba(58,38,24,.25)); }
.furn.wig, .base.wig { animation: wig2 .4s; }
@keyframes wig2 { 25% { rotate: -8deg; } 75% { rotate: 8deg; } }
.base { position: absolute; transform: translateX(-50%); cursor: pointer; padding: 0; }
.fridge {
  left: 88%; bottom: 5%; width: 19cqw; height: 44cqw; border: 3px solid var(--bark); border-radius: 12px;
  background: linear-gradient(#f7fbff 0 38%, var(--bark) 38% calc(38% + 3px), #eef6fb calc(38% + 3px));
}
.fridge i { position: absolute; left: 12%; width: 5px; height: 16%; background: #9aa9b5; border-radius: 3px; }
.fridge i.h1 { top: 12%; } .fridge i.h2 { top: 48%; }
.fridge span { position: absolute; right: 10%; top: 8%; font-size: 5cqw; }
.toybox {
  left: 87%; bottom: 5%; width: 21cqw; height: 14cqw; border: 3px solid var(--bark); border-radius: 8px;
  background: linear-gradient(var(--berry) 0 30%, var(--sun) 30% 44%, var(--berry) 44%);
}
.toybox .toys { position: absolute; left: 0; right: 0; top: -8cqw; font-size: 8cqw; line-height: 1; text-align: center; }
.bed {
  left: 50%; bottom: 3%; width: 72cqw; height: 15cqw; border: 3px solid var(--bark); border-radius: 10px 10px 4px 4px;
  background: linear-gradient(90deg, #7d9fe0 0 70%, #ffffff 70%);
}
.bed::before { content: ""; position: absolute; right: -3px; bottom: -3px; width: 5cqw; height: 30cqw; background: var(--bark); border-radius: 10px 10px 2px 2px; }
.bed::after { content: ""; position: absolute; right: 7cqw; top: -4cqw; width: 14cqw; height: 6cqw; background: #ffffff; border: 3px solid var(--bark); border-radius: 50%; }
.showerhead { position: absolute; left: 50%; top: 24%; width: 15cqw; height: 4.5cqw; transform: translateX(-50%); background: #c9d6de; border: 3px solid var(--bark); border-radius: 0 0 60% 60% / 0 0 100% 100%; }
.showerhead::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 2.2cqw; height: 26cqw; transform: translateX(-50%); background: #c9d6de; border: 3px solid var(--bark); border-bottom: 0; }
.yard-sky { position: absolute; inset: 0; background: linear-gradient(var(--sky-top), var(--sky-bottom) 70%); transition: background .8s; }
.night .yard-sky { background: linear-gradient(var(--night-top), var(--night-bottom) 75%); }
.scene .sun, .scene .moon { position: absolute; top: 60px; right: 18px; width: 50px; height: 50px; border-radius: 50%; }
.scene .sun { background: var(--sun); box-shadow: 0 0 0 10px rgba(255,200,61,.3); }
.scene .moon { background: var(--paper); box-shadow: inset -12px -4px 0 0 #d9d2bd; display: none; }
.night .sun { display: none; } .night .moon { display: block; }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; }
.ground svg { width: 100%; height: 100%; display: block; }
.fence {
  position: absolute; left: 0; right: 0; bottom: 30%; height: 10cqw;
  background: linear-gradient(#e8d9bd, #e8d9bd) 0 25% / 100% 1.6cqw no-repeat, linear-gradient(#e8d9bd, #e8d9bd) 0 75% / 100% 1.6cqw no-repeat,
    repeating-linear-gradient(90deg, #fffaf0 0 4.5cqw, transparent 4.5cqw 8cqw);
}
.gate {
  left: 84%; bottom: 27%; width: 19cqw; height: 16cqw; border: 3px solid var(--bark); border-radius: 9cqw 9cqw 4px 4px;
  background: repeating-linear-gradient(90deg, #b9824c 0 3cqw, #a8743f 3cqw 3.4cqw); color: var(--paper);
  font-weight: 800; font-size: 3.8cqw; display: grid; place-items: center; align-content: center; line-height: 1;
}
.gate span { font-size: 6cqw; }
.night-veil { position: absolute; inset: 0; background: #0b1230; opacity: 0; pointer-events: none; transition: opacity .8s; z-index: 7; }
.scene.night .night-veil { opacity: .45; }
.zz { position: absolute; inset: 0; pointer-events: none; z-index: 8; }

.hogwrap { position: absolute; left: 50%; bottom: 4%; width: min(60%, 360px); transform: translateX(-50%); aspect-ratio: 340 / 260; max-width: 100%; cursor: pointer; z-index: 3; }
.hogwrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
svg .hogg { transform-origin: 160px 240px; }
#hogsvg .hogg { animation: breathe 3s ease-in-out infinite; }
#hogsvg .hogg.jump { animation: jump .55s ease-out; }
#hogsvg .hogg.wiggle { animation: wiggle .5s ease-in-out; }
#hogsvg .hogg.chew { animation: chew .25s ease-in-out 4; }
.night #hogsvg .hogg { animation: breathe 4.5s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.015, 1.035); } }
@keyframes jump { 40% { transform: translateY(-34px) scale(.98,1.04); } 75% { transform: translateY(0) scale(1.05,.95); } }
@keyframes wiggle { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
@keyframes chew { 50% { transform: scale(1.02, .97); } }
.eyes-closed, .mouth-open { display: none; }
.sleepy .eyes-open, .blink .eyes-open { display: none; }
.sleepy .eyes-closed, .blink .eyes-closed { display: inline; }
.eating .mouth-open { display: inline; }
.eating .mouth { display: none; }

.roombar { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; z-index: 9; }
.roomname { background: var(--paper); border: 3px solid var(--bark); border-radius: 999px; padding: 0 12px; font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
.roombar .sp { flex: 1; }
.ract { border: 3px solid var(--bark); background: var(--sun); border-radius: 999px; padding: 2px 12px; font-weight: 800; font-size: 1.02rem; cursor: pointer; white-space: nowrap; box-shadow: 0 3px 0 var(--bark); }
.ract.alt { background: var(--paper); }
.ract:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--bark); }

.bubble {
  position: absolute; left: 50%; top: 56px; transform: translateX(-50%); background: var(--paper);
  border: 3px solid var(--bark); border-radius: 20px; padding: 4px 14px; font-weight: 800; font-size: 1.15rem;
  white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; z-index: 10; box-sizing: border-box;
}
.bubble.pop { animation: popin .35s ease-out; }
@keyframes popin { from { transform: translateX(-50%) scale(.6); } }
.fx { position: absolute; pointer-events: none; font-size: 2rem; animation: floatup 1.4s ease-out forwards; z-index: 30; }
@keyframes floatup { to { transform: translateY(-110px) scale(1.3); opacity: 0; } }
.fx.drip { font-size: 1.3rem; animation: drip .7s ease-in forwards; }
@keyframes drip { to { transform: translateY(80px); opacity: 0; } }
.target { position: absolute; font-size: 2.6rem; border: 0; background: none; cursor: pointer; padding: 6px; animation: appear .3s ease-out; z-index: 6; line-height: 1; }
@keyframes appear { from { transform: scale(0); } }
.target.gone { animation: vanish .3s forwards; }
@keyframes vanish { to { transform: scale(0); opacity: 0; } }
.hint {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: var(--paper);
  border: 3px solid var(--bark); border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 1.05rem; white-space: nowrap; z-index: 8;
}
.hint.top { top: 104px; bottom: auto; }
.hint .pb { display: inline-block; width: 70px; height: 10px; background: var(--soft); border-radius: 9px; vertical-align: middle; overflow: hidden; margin-left: 6px; border: 2px solid var(--bark); }
.hint .pb i { display: block; height: 100%; width: 0; background: var(--sea); transition: width .2s; }
.foodtray {
  position: absolute; left: 50%; top: 104px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center;
  gap: 6px; width: max-content; max-width: 94%; box-sizing: border-box;
  background: var(--paper); border: 3px solid var(--bark); border-radius: 22px; padding: 8px; z-index: 11; animation: popup .25s ease-out;
}
@keyframes popup { from { transform: translate(-50%, -20px); opacity: 0; } }
.food { display: grid; justify-items: center; border: 3px solid var(--soft); background: #ffffff; border-radius: 16px; padding: 2px 8px; cursor: pointer; font-weight: 700; font-size: .8rem; position: relative; min-width: 62px; }
.food span { font-size: 2rem; line-height: 1.15; }
.food em { position: absolute; top: -8px; right: -6px; background: var(--berry); color: #ffffff; font-style: normal; font-weight: 800; border-radius: 999px; padding: 0 6px; font-size: .8rem; border: 2px solid var(--paper); }
.food em.inf { background: var(--leaf); }
.traynote { width: 100%; text-align: center; font-weight: 700; font-size: .85rem; color: var(--bark); }
.flying { position: absolute; font-size: 2.4rem; z-index: 40; pointer-events: none; transition: left .6s ease-in, top .6s cubic-bezier(.3,-0.6,.7,1), transform .6s; }
.confetti { position: fixed; width: 10px; height: 14px; top: -20px; z-index: 100; pointer-events: none; animation: fall 2.4s linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* bath */
.steps { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); display: grid; gap: 6px; z-index: 9; pointer-events: none; }
.stp { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--bark); background: var(--paper); font-size: 1.3rem; display: grid; place-items: center; position: relative; opacity: .55; }
.stp.cur { background: var(--sun); opacity: 1; transform: scale(1.15); }
.stp.ok { opacity: 1; }
.stp.ok::after { content: "✓"; position: absolute; right: -7px; top: -7px; width: 20px; height: 20px; border-radius: 50%; background: var(--leaf); color: #ffffff; font-size: .8rem; font-weight: 800; display: grid; place-items: center; }
.cursor { position: absolute; font-size: 2.8rem; pointer-events: none; z-index: 12; transform: translate(-50%, -50%); }
.duck { position: absolute; font-size: 2.4rem; z-index: 8; border: 0; background: none; cursor: pointer; padding: 0; line-height: 1; transform: translate(-50%, -50%); animation: float 2.2s ease-in-out infinite; }
.duck.squeak { animation: squeak .35s; }
@keyframes float { 50% { translate: 0 -5px; rotate: -6deg; } }
@keyframes squeak { 50% { scale: 1.35 .8; } }
.pbub {
  position: absolute; width: 42px; height: 42px; border-radius: 50%; border: 2px solid #ffffff; padding: 0; cursor: pointer; z-index: 8;
  background: radial-gradient(circle at 30% 30%, #ffffff 0 12%, rgba(200,235,255,.55) 30%, rgba(150,200,255,.3)); animation: rise 6s linear forwards;
}
@keyframes rise { 25% { translate: 14px -90px; } 50% { translate: -10px -180px; } 75% { translate: 12px -270px; } 100% { translate: 0 -360px; opacity: .2; } }

/* ---------- panels ---------- */
.screen { position: absolute; inset: 0; z-index: 20; background: var(--paper); display: flex; flex-direction: column; animation: slidein .25s ease-out; }
@keyframes slidein { from { transform: translateY(30px); opacity: 0; } }
.screen-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--soft); border-bottom: 3px solid var(--bark); }
.screen-head h2 { margin: 0; flex: 1; font-size: 1.4rem; font-weight: 800; line-height: 1.1; color: var(--bark); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { border: 3px solid var(--bark); background: var(--paper); border-radius: 999px; padding: 2px 12px; font-weight: 800; font-size: 1rem; cursor: pointer; white-space: nowrap; }
.pill.go { background: var(--sun); }
.pill:disabled { opacity: .5; cursor: default; }
.screen-body { flex: 1; overflow: auto; padding: 12px; position: relative; min-height: 0; }
.screen-body.flush { padding: 0; overflow: hidden; }
.toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 15; background: var(--paper);
  border: 3px solid var(--bark); border-radius: 18px; padding: 4px 14px; font-weight: 800; font-size: 1.1rem;
  width: max-content; max-width: 88%; text-align: center; pointer-events: none; box-sizing: border-box;
}
.flush .toast { top: 46px; }
.toast.pop { animation: popin .35s ease-out; }
.minihog { display: block; width: 100%; height: auto; overflow: visible; }
.gamegrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.gamecard { border: 4px solid var(--bark); border-radius: 20px; background: #ffffff; padding: 10px 8px; cursor: pointer; display: grid; justify-items: center; gap: 2px; text-align: center; box-shadow: 0 4px 0 var(--bark); }
.gamecard:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--bark); }
.gamecard .ico { font-size: 2.6rem; line-height: 1.1; }
.gamecard b { font-size: 1.15rem; }
.gamecard small { font-size: .85rem; line-height: 1.2; color: var(--bark); font-weight: 600; }
.result { position: absolute; inset: 0; z-index: 16; display: grid; place-items: center; background: rgba(255,250,240,.86); padding: 16px; }
.result .card { background: #ffffff; border: 4px solid var(--bark); border-radius: 22px; padding: 16px 20px; text-align: center; display: grid; gap: 8px; max-width: 320px; animation: popup2 .3s ease-out; }
@keyframes popup2 { from { transform: scale(.8); opacity: 0; } }
.result .big { font-size: 2.6rem; line-height: 1.1; overflow-wrap: anywhere; }
.result p { margin: 0; font-weight: 800; font-size: 1.15rem; }
.result .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.memo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 420px; margin: 0 auto; }
.memo button { aspect-ratio: 1; border-radius: 16px; border: 3px solid var(--bark); cursor: pointer; padding: 0; font-size: 2rem; background: var(--leaf); color: transparent; position: relative; transition: background-color .25s; }
.memo button::after { content: "?"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--paper); font-weight: 800; font-size: 1.8rem; }
.memo button.open, .memo button.done { background: #ffffff; color: var(--ink); }
.memo button.open::after, .memo button.done::after { content: none; }
.memo button.done { border-color: var(--leaf); }
.memo-stat { text-align: center; font-weight: 800; margin-bottom: 8px; font-size: 1.1rem; }
.arena { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(var(--sky-top), var(--sky-bottom) 75%, #9bd27a 75%); touch-action: none; }
.gstat { position: absolute; left: 10px; top: 8px; z-index: 5; background: var(--paper); border: 3px solid var(--bark); border-radius: 999px; padding: 2px 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.gstat.bump { animation: bump .35s; }
.arena-hog { position: absolute; bottom: 6px; width: 96px; transform: translateX(-50%); }
.arena-hog.hit { animation: wiggle .4s; }
.faller { position: absolute; font-size: 2.3rem; line-height: 1; transform: translate(-50%, -50%); pointer-events: none; }
.mound { position: absolute; bottom: 22%; width: 28%; max-width: 140px; aspect-ratio: 1.1; transform: translateX(-50%); transition-property: left; transition-timing-function: ease-in-out; }
.mound .mhog { position: absolute; left: 6%; right: 6%; bottom: 0; }
.mound .cover { position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; border-radius: 50% 50% 14px 14px / 70% 70% 14px 14px; background: radial-gradient(circle at 35% 30%, #c98a4a, #8a5a3b 70%); border-bottom: 6px solid #5e3b24; transition: transform .35s ease-out; font-size: 1.7rem; display: grid; place-items: center; }
.mound.up .cover { transform: translateY(-75%); }
.shell-msg { position: absolute; left: 0; right: 0; top: 46px; text-align: center; font-weight: 800; font-size: 1.25rem; z-index: 5; }

/* shop */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs .pill { font-size: .95rem; }
.roomchips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.roomchips .pill { font-size: .85rem; padding: 0 9px; border-width: 2px; }
.shop-top { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; background: var(--soft); border-radius: 18px; padding: 8px 12px; }
.shop-top .pv { width: 130px; flex: none; }
.shop-top .info { display: grid; gap: 4px; min-width: 0; }
.shop-top .info b { font-size: 1.25rem; line-height: 1.1; }
.shop-top .info span { font-weight: 600; color: var(--bark); }
.roomtop { display: grid; gap: 8px; margin-bottom: 12px; background: var(--soft); border-radius: 18px; padding: 8px; }
.pvbox { position: relative; width: 100%; max-width: 440px; margin: 0 auto; aspect-ratio: 16 / 11; border-radius: 14px; overflow: hidden; border: 3px solid var(--bark); container-type: inline-size; pointer-events: none; background: var(--soft); }
.pvhog { position: absolute; left: 50%; bottom: 4%; width: 60%; transform: translateX(-50%); }
.roomtop .info { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 0 4px; }
.roomtop .info b { font-size: 1.2rem; }
.roomtop .info span { font-weight: 600; color: var(--bark); }
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
.item { border: 3px solid var(--soft); border-radius: 16px; background: #ffffff; cursor: pointer; padding: 4px 4px 2px; display: grid; justify-items: center; position: relative; min-width: 0; }
.item.sel { border-color: var(--sun); box-shadow: 0 0 0 3px var(--sun); }
.item .thumb { width: 100%; aspect-ratio: 1.25; overflow: hidden; border-radius: 10px; background: var(--soft); display: grid; place-items: center; font-size: 2.6rem; line-height: 1; }
.item .thumb svg { width: 100%; height: 100%; overflow: hidden; }
.item .thumb.sw { border: 2px solid rgba(58,38,24,.25); box-sizing: border-box; }
.item .nm { font-weight: 700; font-size: .85rem; line-height: 1.1; text-align: center; }
.item .pr { font-weight: 800; font-size: .9rem; }
.item .pr.owned { color: var(--leaf); }
.item .worn { position: absolute; top: 4px; right: 4px; background: var(--leaf); color: #ffffff; border-radius: 999px; font-size: .7rem; font-weight: 800; padding: 0 6px; }
.slot-title { font-weight: 800; color: var(--bark); margin: 10px 0 4px; font-size: 1rem; }

/* trip */
.trip { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
.deco span { position: absolute; transform: translateX(-50%); line-height: 1; pointer-events: none; animation: decoin .9s ease-out; transition: translate .9s ease-in; }
.deco span.out { translate: -700px 0; }
@keyframes decoin { from { translate: 700px 0; } }
.stage { position: absolute; inset: 0; }
.walker { position: absolute; bottom: 6%; left: 18%; width: 84px; transform: translateX(-50%); transition: left .6s ease-in-out; z-index: 6; pointer-events: none; }
.walker .flip { transition: transform .2s; }
.walker.left .flip { transform: scaleX(-1); }
.walker.step .flip { animation: hop .3s 3; }
.walker.bigjump .flip { animation: bigjump .8s ease-out; }
@keyframes hop { 50% { translate: 0 -8px; } }
@keyframes bigjump { 50% { translate: 0 -90px; } }
.dots { position: absolute; right: 10px; top: 12px; display: flex; gap: 4px; z-index: 5; }
.dots i { width: 13px; height: 13px; border-radius: 50%; background: var(--paper); border: 2px solid var(--bark); }
.dots i.on { background: var(--sun); }
.choices { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; z-index: 9; width: max-content; max-width: 94%; }
.choices .pill { font-size: 1.1rem; padding: 4px 14px; box-shadow: 0 3px 0 var(--bark); }

.next { position: absolute; right: 12px; bottom: 12px; z-index: 9; font-size: 1.25rem; padding: 6px 18px; box-shadow: 0 4px 0 var(--bark); animation: nudge 1.8s ease-in-out infinite; }
.thing { position: absolute; transform: translateX(-50%); border: 0; background: none; padding: 0; line-height: 1; cursor: pointer; z-index: 4; }
.thing.pop-in { animation: popin2 .4s ease-out; }
@keyframes popin2 { from { scale: 0; } }
.thing.shake { animation: wig2 .35s; }
.bush { width: 150px; height: 108px; border-radius: 70px 70px 26px 26px; background: radial-gradient(circle at 30% 30%, #7ccc58, #3f8a2f 70%); border: 4px solid #2f6a24; cursor: default; }
.berry { position: absolute; font-size: 1.9rem; border: 0; background: none; padding: 0; cursor: pointer; line-height: 1; }
.tree { width: 170px; height: 190px; }
.tree .crown { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10.5rem; line-height: 1; text-align: center; pointer-events: none; }
.tree .fruit { position: absolute; font-size: 1.9rem; border: 0; background: none; padding: 0; line-height: 1; pointer-events: none; transition: top .6s cubic-bezier(.5,0,1,.6), left .6s; z-index: 2; }
.tree .fruit.down { pointer-events: auto; cursor: pointer; }
.tree.shake { animation: wig2 .35s; }
.dmound { width: 120px; height: 66px; border-radius: 60px 60px 10px 10px; background: radial-gradient(circle at 40% 30%, #b0784a, #6b4329); transition: transform .2s; transform-origin: bottom; font-size: 1.4rem; }
.puddle { width: 160px; height: 36px; border-radius: 50%; background: radial-gradient(#8fd0f5, #4a90c4); border: 3px solid #2f6a9a; cursor: default; }
.friend { font-size: 5rem; animation: bob 1.6s ease-in-out infinite, enter .7s ease-out; }
.friend.happy { animation: fjump .55s ease-out; }
@keyframes fjump { 40% { translate: 0 -34px; } }
@keyframes bob { 50% { translate: 0 -6px; } }
@keyframes enter { from { margin-left: 320px; opacity: 0; } }
.leafpile { font-size: 3rem; }
.mover { font-size: 2.8rem; transition: left .75s ease-in-out, bottom .75s ease-in-out; z-index: 7; }
.cloud { font-size: 5rem; transition: left 1.4s ease-in, opacity 1.4s; z-index: 7; }
.rainbow { font-size: 6rem; pointer-events: none; animation: popin2 .8s ease-out; }
.sparkle { font-size: 2.6rem; animation: twinkle .6s infinite alternate; }

.found { position: absolute; transform: translate(-50%, -50%); font-size: 3.4rem; z-index: 6; pointer-events: none; animation: foundpop 1.6s ease-out forwards; }
@keyframes foundpop { 0% { scale: 0; } 20% { scale: 1.3; } 30% { scale: 1; } 80% { opacity: 1; translate: 0 -30px; } 100% { opacity: 0; translate: 0 -50px; } }
.album-sec { margin-bottom: 12px; }

.stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }

.teach .rep { flex: none; font-size: 1.3rem; padding: 2px 10px; }
.board {

.board.play { background: radial-gradient(#a6dd84, #7cbf5a); }

.set-sec { background: #ffffff; border: 3px solid var(--soft); border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; display: grid; gap: 6px; }
.set-sec h3 { margin: 0; font-size: 1.05rem; }
.set-sec p { margin: 0; font-size: .9rem; color: var(--bark); font-weight: 600; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opts .pill { font-size: .9rem; }

.pgate h3 { margin: 0; font-size: 1.3rem; }

.pgate .row { display: flex; gap: 8px; }
.lock {
  position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px;

.lock .card .minihog { width: 190px; margin: 0 auto; }
.lock h2 { margin: 0; color: var(--bark); font-size: 1.5rem; line-height: 1.15; }
.lock p { margin: 0; font-weight: 700; font-size: 1.1rem; }
.lock .pill { justify-self: center; font-size: .9rem; opacity: .8; }

/* ---------- room tabs ---------- */
.actions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.act {
  font-weight: 800; font-size: .95rem; border: 4px solid var(--bark); border-radius: 20px; background: var(--paper);
  padding: 6px 2px 4px; display: grid; justify-items: center; cursor: pointer; box-shadow: 0 5px 0 var(--bark);
  transition: transform .08s, box-shadow .08s; min-width: 0; white-space: nowrap; overflow: hidden;
}
.act span { font-size: 2rem; line-height: 1.15; }
.act:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--bark); }
.act[aria-pressed="true"] { background: var(--sun); transform: translateY(3px); box-shadow: 0 2px 0 var(--bark); }
.act:disabled { opacity: .45; cursor: default; }
.act.need { animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 70%, 100% { rotate: 0deg; } 80% { rotate: -4deg; } 90% { rotate: 4deg; } }

@media (max-width: 460px) {
  .titlebar h1 { font-size: 1.5rem; }
  .iconbtn { width: 40px; height: 40px; font-size: 1.15rem; }

  .actions { gap: 5px; }
  .act { font-size: .72rem; border-radius: 14px; border-width: 3px; }
  .act span { font-size: 1.6rem; }
  .bubble { font-size: 1rem; }
  .shop-top .pv { width: 104px; }
  .friend { font-size: 4.2rem; }
  .tree { width: 150px; height: 170px; }
  .tree .crown { font-size: 9.4rem; }
  .roomname { font-size: .95rem; padding: 0 9px; }
  .ract { font-size: .92rem; padding: 2px 9px; }
}
@media (max-height: 560px) {
  .progress { display: none; }
  .act span { font-size: 1.4rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

            teach(f.n + ": Tu som! " + (left ? "Ešte " + NUMS[left - 1] + "." : "Všetci sú nájdení!"));
            if (!left) setTimeout(finish, 1200);
          } else { b.style.opacity = .4; sfx.flip(); teach("Tu nikto nie je. Hľadaj ďalej!"); }
        });
      });
    }
    if (L.play) hideAndSeek(); else nextQ();
  }

  // ================= ALBUM =================
  function openAlbum() {
    var fc = Object.keys(FRIENDS).filter(function (k) { return S.friends[k]; }).length;
    var tc = Object.keys(TREASURES).filter(function (k) { return S.treasures[k]; }).length;
    openScreen("Zbierka"); resetBody(false);
    [["🐾 Kamaráti", FRIENDS, S.friends, fc], ["💎 Poklady", TREASURES, S.treasures, tc]].forEach(function (sec) {
      var box = mk("div", "album-sec", null, panel.body);
      var h = mk("h3", null, null, box); mk("span", null, sec[0], h); mk("small", null, sec[3] + "/" + Object.keys(sec[1]).length, h);
      var g = mk("div", "stickers", null, box);
      Object.keys(sec[1]).forEach(function (k) {
        var got = !!sec[2][k], d = mk("div", "sticker" + (got ? " got" : ""), null, g);
        mk("span", "e", sec[1][k].e, d); mk("span", "n", got ? sec[1][k].n : "?", d);
      });
    });
    var sch = mk("div", "album-sec", null, panel.body);
    var sh = mk("h3", null, null, sch); mk("span", null, "🏫 Nálepky zo škôlky", sh);
    mk("small", null, LESSONS.reduce(function (a, L) { return a + (S.school[L.id] || 0); }, 0) + " ks", sh);
    var sg = mk("div", "stickers", null, sch);
    LESSONS.forEach(function (L) {
      var n = S.school[L.id] || 0, d = mk("div", "sticker" + (n ? " got" : ""), null, sg);
      mk("span", "e", L.e, d); mk("span", "n", L.n + " ×" + n, d);
    });
    var foods = mk("div", "album-sec", null, panel.body);
    var h = mk("h3", null, null, foods); mk("span", null, "🧺 Zásoby jedla", h); mk("small", null, foodTotal() + " ks", h);
    var g = mk("div", "stickers", null, foods);
    FOOD_ORDER.forEach(function (id) {
      var n = S.food[id] || 0, d = mk("div", "sticker" + (n ? " got" : ""), null, g);
      mk("span", "e", FOODS[id].e, d); mk("span", "n", FOODS[id].n + " ×" + n, d);
    });
  }

  // ================= DAILY LIMIT =================
  var locked = false, lockEl = null, settingsOpen = false, warned = false;
  var DAILY_KIBBLE = 2, KIBBLE_CAP = 3, dailyGift = false, started = false;
  function checkDay() {
    var t = today();
    if (S.playDay !== t) {
      if (S.playDay) {
        var before = S.food.kibble || 0;
        S.food.kibble = Math.min(KIBBLE_CAP, before + DAILY_KIBBLE);
        if (S.food.kibble > before) dailyGift = true;
      }
      S.playDay = t; S.playSec = 0; warned = false;
      if (locked) unlock();
      save();
    }
    if (dailyGift && started && mode === "idle" && !locked) {
      dailyGift = false;
      say("Nový deň! Do chladničky pribudli granule 🥣. Na dobroty poďme na výlet!", 6000);
      lastSay = Date.now() + 6000;
    }
  }
  function checkLimit() {
    var lim = S.settings.limit;
    if (!lim) return;
    var left = lim * 60 - S.playSec;
    if (left <= 180 && !warned && mode === "idle") { warned = true; say("Čoskoro pôjdem spinkať. Ešte chvíľku sa pohráme!", 6000); }
    if (left <= 0) lock();
  }
  function lock() {
    if (locked) return;
    locked = true;
    if (panel) closeScreen(true);
    if (bath) endBath(false);
    if (mode === "play") endPlay();
    if (tray) closeTray();
    mode = "idle";
    save();
    lockEl = mk("div", "lock", null, document.body);
    var card = mk("div", "card", null, lockEl);
    card.innerHTML = miniHog().replace('class="minihog"', 'class="minihog sleepy"');
    mk("h2", null, "Dnešné hranie skončilo", card);
    mk("p", null, "Ježko si potrebuje oddýchnuť a ty tiež. Uvidíme sa zajtra! 🌙", card);
    var b = mk("button", "pill", "⚙️ Pre rodičov", card);
    b.addEventListener("click", function () { lockEl.hidden = true; openSettings(); });
    sfx.sleep();
  }
  function unlock() { locked = false; if (lockEl) { lockEl.remove(); lockEl = null; } drawRoom(); render(); }
  function afterSettings() {
    settingsOpen = false;
    if (locked) {
      if (S.settings.limit && S.playSec >= S.settings.limit * 60) lockEl.hidden = false;
      else unlock();
    }
  }

  // ================= SETTINGS (behind a simple parent question) =================
  function openSettings() {
    settingsOpen = true;
    openScreen("Nastavenia");
    drawGate();
  }
  function drawGate() {
    resetBody(false); panel.onClose = afterSettings;
    var a = 6 + rnd(7), b = 4 + rnd(6);
    var g = mk("div", "pgate", null, panel.body);
    mk("h3", null, "Len pre rodičov", g);
    mk("p", null, "Koľko je " + a + " + " + b + "?", g);
    var inp = mk("input", null, null, g); inp.type = "text"; inp.inputMode = "numeric"; inp.id = "gateIn"; inp.autocomplete = "off"; inp.setAttribute("aria-label", "Výsledok");
    var row = mk("div", "row", null, g);
    var ok = mk("button", "pill go", "Pokračovať", row);
    function check() {
      if (parseInt(inp.value, 10) === a + b) { sfx.pet(); drawSettings(); }
      else { sfx.no(); drawGate(); toast("To nie je správne. Skúste znova.", 2000); }
    }
    ok.addEventListener("click", check);
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 50);
  }
  function opts(parent, list, current, onPick) {
    var row = mk("div", "opts", null, parent);
    list.forEach(function (o) {
      var b = mk("button", "pill" + (o[0] === current ? " go" : ""), o[1], row);
      b.addEventListener("click", function () { onPick(o[0]); save(); sfx.flip(); drawSettings(); });
    });
  }
  function section(title, text) {
    var sec = mk("div", "set-sec", null, panel.body);
    mk("h3", null, title, sec);
    if (text) mk("p", null, text, sec);
    return sec;
  }
  function drawSettings() {
    var y = panel.body.scrollTop;
    resetBody(false); panel.onClose = afterSettings;
    var sec = section("🔊 Zvuk");
    opts(sec, [[true, "Zapnutý"], [false, "Vypnutý"]], S.sound, function (v) { S.sound = v; });

    var played = Math.floor(S.playSec / 60);
    sec = section("⏰ Denný čas hrania", "Po uplynutí času Ježko zaspí a hra sa odomkne až zajtra. Čas sa počíta len vtedy, keď je hra otvorená a Ježko nespí. Dnes odohrané: " + played + " min.");
    opts(sec, [[15, "15 min"], [30, "30 min"], [45, "45 min"], [60, "1 hodina"], [0, "Bez limitu"]], S.settings.limit, function (v) { S.settings.limit = v; });
    var extra = mk("div", "opts", null, sec);
    var more = mk("button", "pill", "Dnes ešte +15 min", extra);
    more.addEventListener("click", function () { S.playSec = Math.max(0, S.playSec - 900); save(); sfx.pet(); drawSettings(); });

    sec = section("🐢 Ako rýchlo Ježko potrebuje starostlivosť", "Potreby klesajú pomaly aj vtedy, keď je hra zavretá. Ježko nikdy neochorie ani neumrie, keď sa oň nikto nestará, len posmutnie. Najviac ho unavujú a hladom trápia výlety a hry.");
    opts(sec, [["slow", "Pomaly – vydrží celý deň"], ["normal", "Normálne – pár hodín"]], S.settings.pace, function (v) { S.settings.pace = v; });

    sec = section("🗣️ Hlas pani učiteľky", "V škôlke pani učiteľka číta úlohy nahlas, aby ich zvládli aj deti, ktoré ešte nečítajú. Použije sa slovenský hlas zariadenia, ak ho zariadenie má.");
    opts(sec, [[true, "Zapnutý"], [false, "Vypnutý"]], S.settings.voice, function (v) { S.settings.voice = v; if (!v) hush(); });

    sec = section("💤 Ako dlho Ježko spinká", "Spánok beží aj pri zatvorenej hre. Je to prirodzená prestávka v hraní.");
    opts(sec, [[5, "5 min"], [15, "15 min"], [30, "30 min"], [60, "1 hodina"]], S.settings.sleepMin, function (v) { S.settings.sleepMin = v; });

    sec = section("🗑️ Začať odznova", "Vymaže hviezdičky, oblečenie, nábytok, zásoby jedla aj zbierku. Nastavenia zostanú.");
    var delRow = mk("div", "opts", null, sec);
    var del = mk("button", "pill danger", "Vymazať postup", delRow);
    del.addEventListener("click", function () {
      delRow.innerHTML = "";
      mk("p", null, "Naozaj vymazať všetko? Nedá sa to vrátiť späť.", sec);
      var row2 = mk("div", "opts", null, sec);
      var yes = mk("button", "pill danger", "Áno, vymazať", row2);
      var no = mk("button", "pill", "Nie", row2);
      no.addEventListener("click", drawSettings);
      yes.addEventListener("click", resetProgress);
    });
    panel.body.scrollTop = y;
  }
  function resetProgress() {
    var keep = { settings: S.settings, sound: S.sound, playDay: S.playDay, playSec: S.playSec };
    S = fresh();
    Object.assign(S, keep);
    dressedKey = null;
    if (sleepHint) { sleepHint.remove(); sleepHint = null; }
    save();
    closeScreen(true);
    afterSettings();
    mode = "idle";
    drawRoom(); render(); confetti();
    say("Ahoj! Ja som Ježko! Začíname odznova.", 4000);
  }

  // ================= HEADER =================
  $("shopBtn").addEventListener("click", function () { if (mode === "idle" || mode === "feed") openShop(S.room === "bed" ? "clothes" : "furn"); });
  $("albumBtn").addEventListener("click", function () { if (mode === "idle" || mode === "feed") openAlbum(); });
  $("setBtn").addEventListener("click", function () { if (mode === "idle" || mode === "feed") openSettings(); });

  dressMain();
  if (S.sleeping) { S.room = "bed"; }
  drawRoom();
  if (S.sleeping) enterSleep();
  checkDay();
  render();
  if (S.settings.limit && S.playSec >= S.settings.limit * 60) lock();
  setTimeout(function () {
    started = true;
    if (dailyGift) { checkDay(); return; }
    say(wokeWhileAway ? "Dobré ráno! Vyspal som sa do ružova!" : S.sleeping ? "Chrrr... Ježko ešte spinká." : "Ahoj! Ja som Ježko! Vitaj v mojom domčeku!", 4000);
  }, 300);
})();
</script>
</body>
</html>
