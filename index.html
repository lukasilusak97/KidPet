<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ježko</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen app — status meters on top, meadow scene in the middle (shop, games, trips and album open as panels over it), big care buttons at the bottom. Single deliberate daylight-meadow look; night is an in-game state. */
:root {
  --sky-top: #bfe6f5;
  --sky-bottom: #eaf7e4;
  --night-top: #1d2a4d;
  --night-bottom: #3c4f7a;
  --ink: #3a2618;
  --paper: #fffaf0;
  --bark: #8a5a3b;
  --berry: #e2504c;
  --sun: #ffc83d;
  --leaf: #4f9a3a;
  --soft: #f3e6cf;
  --sea: #5aa7e0;
  --font: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky-bottom); color: var(--ink); font-family: var(--font);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overflow: hidden;
}
button { font-family: inherit; color: var(--ink); }
.app {
  height: 100%; display: grid; grid-template-rows: auto 1fr auto; max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; gap: 10px; box-sizing: border-box;
}

/* ---------- top bar ---------- */
.top { display: grid; gap: 8px; }
.titlebar { display: flex; align-items: center; gap: 6px; }
.titlebar h1 { margin: 0; font-size: 1.9rem; font-weight: 800; line-height: 1; color: var(--bark); flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; background: var(--paper); border: 3px solid var(--bark);
  border-radius: 999px; padding: 2px 12px; font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums;
}
.chip.bump { animation: bump .4s; }
@keyframes bump { 50% { transform: scale(1.25); } }
.iconbtn {
  font-size: 1.3rem; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--bark);
  background: var(--paper); cursor: pointer; padding: 0; display: grid; place-items: center; flex: none;
}
.iconbtn:disabled { opacity: .45; cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.meter { background: var(--paper); border: 3px solid var(--bark); border-radius: 14px; padding: 4px 8px 6px; display: grid; gap: 2px; min-width: 0; }
.meter .lbl { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: .9rem; white-space: nowrap; overflow: hidden; }
.meter .lbl b { font-size: 1.1rem; }
.bar { height: 12px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; width: 50%; border-radius: 99px; background: var(--leaf); transition: width .4s, background-color .4s; }
.bar i.mid { background: var(--sun); }
.bar i.low { background: var(--berry); animation: blinkbar 1s infinite; }
@keyframes blinkbar { 50% { opacity: .45; } }
.progress { font-size: .95rem; font-weight: 700; text-align: center; color: var(--bark); }

/* ---------- scene ---------- */
.scene {
  position: relative; border-radius: 24px; overflow: hidden; min-height: 0;
  background: linear-gradient(var(--sky-top), var(--sky-bottom) 70%); border: 4px solid var(--bark);
  transition: background .8s; touch-action: none;
}
.scene.night { background: linear-gradient(var(--night-top), var(--night-bottom) 75%); }
.scene .sun, .scene .moon { position: absolute; top: 14px; right: 18px; width: 54px; height: 54px; border-radius: 50%; transition: opacity .8s, transform .8s; }
.scene .sun { background: var(--sun); box-shadow: 0 0 0 10px rgba(255,200,61,.3); }
.scene .moon { background: var(--paper); box-shadow: inset -12px -4px 0 0 #d9d2bd; opacity: 0; transform: translateY(20px); }
.scene.night .sun { opacity: 0; transform: translateY(20px); }
.scene.night .moon { opacity: 1; transform: none; }
.stars-sky { position: absolute; inset: 0; opacity: 0; transition: opacity .8s; pointer-events: none; }
.scene.night .stars-sky { opacity: 1; }
.stars-sky span { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--paper); animation: twinkle 2s infinite alternate; }
@keyframes twinkle { to { opacity: .2; } }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; }
.ground svg { width: 100%; height: 100%; display: block; }
.night-veil { position: absolute; inset: 0; background: #0b1230; opacity: 0; pointer-events: none; transition: opacity .8s; }
.scene.night .night-veil { opacity: .28; }
.hogwrap { position: absolute; left: 50%; bottom: 8%; width: min(78%, 420px); transform: translateX(-50%); aspect-ratio: 340 / 260; max-width: 100%; cursor: pointer; }
.hogwrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
svg .hogg { transform-origin: 160px 240px; }
#hogsvg .hogg { animation: breathe 3s ease-in-out infinite; }
#hogsvg .hogg.jump { animation: jump .55s ease-out; }
#hogsvg .hogg.wiggle { animation: wiggle .5s ease-in-out; }
#hogsvg .hogg.chew { animation: chew .25s ease-in-out 4; }
.night #hogsvg .hogg { animation: breathe 4.5s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.015, 1.035); } }
@keyframes jump { 40% { transform: translateY(-34px) scale(.98,1.04); } 75% { transform: translateY(0) scale(1.05,.95); } }
@keyframes wiggle { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
@keyframes chew { 50% { transform: scale(1.02, .97); } }
.eyes-closed, .mouth-open { display: none; }
.sleepy .eyes-open, .blink .eyes-open { display: none; }
.sleepy .eyes-closed, .blink .eyes-closed { display: inline; }
.eating .mouth-open { display: inline; }
.eating .mouth { display: none; }

.bubble {
  position: absolute; left: 50%; top: 6%; transform: translateX(-50%); background: var(--paper);
  border: 3px solid var(--bark); border-radius: 20px; padding: 6px 16px; font-weight: 800; font-size: 1.25rem;
  white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; z-index: 10;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -12px; width: 18px; height: 18px; background: var(--paper);
  border-right: 3px solid var(--bark); border-bottom: 3px solid var(--bark); transform: translateX(-50%) rotate(45deg);
}
.bubble.pop { animation: popin .35s ease-out; }
@keyframes popin { from { transform: translateX(-50%) scale(.6); } }
.fx { position: absolute; pointer-events: none; font-size: 2rem; animation: floatup 1.4s ease-out forwards; z-index: 30; }
@keyframes floatup { to { transform: translateY(-110px) scale(1.3); opacity: 0; } }
.fx.drip { font-size: 1.3rem; animation: drip .7s ease-in forwards; }
@keyframes drip { to { transform: translateY(80px); opacity: 0; } }
.target { position: absolute; font-size: 2.6rem; border: 0; background: none; cursor: pointer; padding: 6px; animation: appear .3s ease-out; z-index: 6; line-height: 1; }
@keyframes appear { from { transform: scale(0); } }
.target.gone { animation: vanish .3s forwards; }
@keyframes vanish { to { transform: scale(0); opacity: 0; } }
.hint {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: var(--paper);
  border: 3px solid var(--bark); border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 1.05rem; white-space: nowrap; z-index: 8;
}
.foodtray {
  position: absolute; left: 50%; top: calc(6% + 64px); transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center;
  gap: 6px; width: max-content; max-width: 94%; box-sizing: border-box;
  background: var(--paper); border: 3px solid var(--bark); border-radius: 22px; padding: 8px; z-index: 11; animation: popup .25s ease-out;
}
@keyframes popup { from { transform: translate(-50%, -20px); opacity: 0; } }
.food { display: grid; justify-items: center; border: 3px solid var(--soft); background: #ffffff; border-radius: 16px; padding: 2px 8px; cursor: pointer; font-weight: 700; font-size: .8rem; position: relative; min-width: 62px; }
.food span { font-size: 2rem; line-height: 1.15; }
.food em { position: absolute; top: -8px; right: -6px; background: var(--berry); color: #ffffff; font-style: normal; font-weight: 800; border-radius: 999px; padding: 0 6px; font-size: .8rem; border: 2px solid var(--paper); }
.food em.inf { background: var(--leaf); }
.traynote { width: 100%; text-align: center; font-weight: 700; font-size: .85rem; color: var(--bark); }
.flying { position: absolute; font-size: 2.4rem; z-index: 40; pointer-events: none; transition: left .6s ease-in, top .6s cubic-bezier(.3,-0.6,.7,1), transform .6s; }
.confetti { position: fixed; width: 10px; height: 14px; top: -20px; z-index: 100; pointer-events: none; animation: fall 2.4s linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* ---------- bath ---------- */
.tools { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); display: grid; gap: 8px; z-index: 9; }
.tool { width: 58px; height: 58px; border-radius: 16px; border: 3px solid var(--bark); background: var(--paper); font-size: 1.9rem; position: relative; cursor: pointer; padding: 0; }
.tool.cur { background: var(--sun); animation: nudge 1.6s ease-in-out infinite; }
.tool.ok::after { content: "✓"; position: absolute; right: -7px; top: -7px; width: 22px; height: 22px; border-radius: 50%; background: var(--leaf); color: #ffffff; font-size: .85rem; font-weight: 800; display: grid; place-items: center; }
.tool:disabled { opacity: .45; cursor: default; }
.tool:disabled.ok { opacity: .8; }
.tool.cur:disabled { opacity: 1; }
.cursor { position: absolute; font-size: 2.8rem; pointer-events: none; z-index: 12; transform: translate(-50%, -50%); }
.hint.top { top: calc(6% + 58px); bottom: auto; }
.hint .pb { display: inline-block; width: 70px; height: 10px; background: var(--soft); border-radius: 9px; vertical-align: middle; overflow: hidden; margin-left: 6px; border: 2px solid var(--bark); }
.hint .pb i { display: block; height: 100%; width: 0; background: var(--sea); transition: width .2s; }
.duck { position: absolute; font-size: 2.6rem; z-index: 8; border: 0; background: none; cursor: pointer; padding: 0; line-height: 1; transform: translate(-50%, -50%); animation: float 2.2s ease-in-out infinite; }
.duck.squeak { animation: squeak .35s; }
@keyframes float { 50% { translate: 0 -5px; rotate: -6deg; } }
@keyframes squeak { 50% { scale: 1.35 .8; } }
.pbub {
  position: absolute; width: 42px; height: 42px; border-radius: 50%; border: 2px solid #ffffff; padding: 0; cursor: pointer; z-index: 8;
  background: radial-gradient(circle at 30% 30%, #ffffff 0 12%, rgba(200,235,255,.55) 30%, rgba(150,200,255,.3)); animation: rise 6s linear forwards;
}
@keyframes rise { 25% { translate: 14px -90px; } 50% { translate: -10px -180px; } 75% { translate: 12px -270px; } 100% { translate: 0 -360px; opacity: .2; } }

/* ---------- panels ---------- */
.screen { position: absolute; inset: 0; z-index: 20; background: var(--paper); display: flex; flex-direction: column; animation: slidein .25s ease-out; }
@keyframes slidein { from { transform: translateY(30px); opacity: 0; } }
.screen-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--soft); border-bottom: 3px solid var(--bark); }
.screen-head h2 { margin: 0; flex: 1; font-size: 1.4rem; font-weight: 800; line-height: 1.1; color: var(--bark); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill {
  border: 3px solid var(--bark); background: var(--paper); border-radius: 999px; padding: 2px 12px;
  font-weight: 800; font-size: 1rem; cursor: pointer; white-space: nowrap;
}
.pill.go { background: var(--sun); }
.pill:disabled { opacity: .5; cursor: default; }
.screen-body { flex: 1; overflow: auto; padding: 12px; position: relative; min-height: 0; }
.screen-body.flush { padding: 0; overflow: hidden; }
.toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 15; background: var(--paper);
  border: 3px solid var(--bark); border-radius: 18px; padding: 4px 14px; font-weight: 800; font-size: 1.1rem;
  width: max-content; max-width: 88%; text-align: center; pointer-events: none; box-sizing: border-box;
}
.flush .toast { top: 46px; }
.toast.pop { animation: popin .35s ease-out; }
.minihog { display: block; width: 100%; height: auto; overflow: visible; }
.gamegrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.gamecard {
  border: 4px solid var(--bark); border-radius: 20px; background: #ffffff; padding: 10px 8px; cursor: pointer;
  display: grid; justify-items: center; gap: 2px; text-align: center; box-shadow: 0 4px 0 var(--bark);
}
.gamecard:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--bark); }
.gamecard .ico { font-size: 2.6rem; line-height: 1.1; }
.gamecard b { font-size: 1.15rem; }
.gamecard small { font-size: .85rem; line-height: 1.2; color: var(--bark); font-weight: 600; }
.result { position: absolute; inset: 0; z-index: 16; display: grid; place-items: center; background: rgba(255,250,240,.86); padding: 16px; }
.result .card { background: #ffffff; border: 4px solid var(--bark); border-radius: 22px; padding: 16px 20px; text-align: center; display: grid; gap: 8px; max-width: 320px; animation: popup2 .3s ease-out; }
@keyframes popup2 { from { transform: scale(.8); opacity: 0; } }
.result .big { font-size: 2.6rem; line-height: 1.1; overflow-wrap: anywhere; }
.result p { margin: 0; font-weight: 800; font-size: 1.15rem; }
.result .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.memo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 420px; margin: 0 auto; }
.memo button {
  aspect-ratio: 1; border-radius: 16px; border: 3px solid var(--bark); cursor: pointer; padding: 0; font-size: 2rem;
  background: var(--leaf); color: transparent; position: relative; transition: transform .25s, background-color .25s;
}
.memo button::after { content: "?"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--paper); font-weight: 800; font-size: 1.8rem; }
.memo button.open, .memo button.done { background: #ffffff; color: var(--ink); }
.memo button.open::after, .memo button.done::after { content: none; }
.memo button.done { border-color: var(--leaf); }
.memo-stat { text-align: center; font-weight: 800; margin-bottom: 8px; font-size: 1.1rem; }
.arena { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(var(--sky-top), var(--sky-bottom) 75%, #9bd27a 75%); touch-action: none; }
.gstat { position: absolute; left: 10px; top: 8px; z-index: 5; background: var(--paper); border: 3px solid var(--bark); border-radius: 999px; padding: 2px 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.gstat.bump { animation: bump .35s; }
.arena-hog { position: absolute; bottom: 6px; width: 96px; transform: translateX(-50%); }
.arena-hog.hit { animation: wiggle .4s; }
.faller { position: absolute; font-size: 2.3rem; line-height: 1; transform: translate(-50%, -50%); pointer-events: none; }
.mound { position: absolute; bottom: 22%; width: 28%; max-width: 140px; aspect-ratio: 1.1; transform: translateX(-50%); transition-property: left; transition-timing-function: ease-in-out; }
.mound .mhog { position: absolute; left: 6%; right: 6%; bottom: 0; }
.mound .cover {
  position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; border-radius: 50% 50% 14px 14px / 70% 70% 14px 14px;
  background: radial-gradient(circle at 35% 30%, #c98a4a, #8a5a3b 70%); border-bottom: 6px solid #5e3b24;
  transition: transform .35s ease-out; font-size: 1.7rem; display: grid; place-items: center;
}
.mound.up .cover { transform: translateY(-75%); }
.shell-msg { position: absolute; left: 0; right: 0; top: 46px; text-align: center; font-weight: 800; font-size: 1.25rem; z-index: 5; }
.shop-top { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; background: var(--soft); border-radius: 18px; padding: 8px 12px; }
.shop-top .pv { width: 130px; flex: none; }
.shop-top .info { display: grid; gap: 4px; min-width: 0; }
.shop-top .info b { font-size: 1.25rem; line-height: 1.1; }
.shop-top .info span { font-weight: 600; color: var(--bark); }
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
.item { border: 3px solid var(--soft); border-radius: 16px; background: #ffffff; cursor: pointer; padding: 4px 4px 2px; display: grid; justify-items: center; position: relative; min-width: 0; }
.item.sel { border-color: var(--sun); box-shadow: 0 0 0 3px var(--sun); }
.item .thumb { width: 100%; aspect-ratio: 1.25; overflow: hidden; border-radius: 10px; background: var(--soft); }
.item .thumb svg { width: 100%; height: 100%; overflow: hidden; }
.item .nm { font-weight: 700; font-size: .85rem; line-height: 1.1; text-align: center; }
.item .pr { font-weight: 800; font-size: .9rem; }
.item .pr.owned { color: var(--leaf); }
.item .worn { position: absolute; top: 4px; right: 4px; background: var(--leaf); color: #ffffff; border-radius: 999px; font-size: .7rem; font-weight: 800; padding: 0 6px; }
.slot-title { font-weight: 800; color: var(--bark); margin: 10px 0 4px; font-size: 1rem; }

/* ---------- trip ---------- */
.trip { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
.deco span { position: absolute; transform: translateX(-50%); line-height: 1; pointer-events: none; animation: decoin .9s ease-out; transition: translate .9s ease-in; }
.deco span.out { translate: -700px 0; }
@keyframes decoin { from { translate: 700px 0; } }
.stage { position: absolute; inset: 0; }
.walker { position: absolute; bottom: 6%; left: 18%; width: 84px; transform: translateX(-50%); transition: left .6s ease-in-out; z-index: 6; pointer-events: none; }
.walker .flip { transition: transform .2s; }
.walker.left .flip { transform: scaleX(-1); }
.walker.step .flip { animation: hop .3s 3; }
.walker.bigjump .flip { animation: bigjump .8s ease-out; }
@keyframes hop { 50% { translate: 0 -8px; } }
@keyframes bigjump { 50% { translate: 0 -90px; } }
.dots { position: absolute; right: 10px; top: 12px; display: flex; gap: 4px; z-index: 5; }
.dots i { width: 13px; height: 13px; border-radius: 50%; background: var(--paper); border: 2px solid var(--bark); }
.dots i.on { background: var(--sun); }
.choices { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; z-index: 9; width: max-content; max-width: 94%; }
.choices .pill { font-size: 1.1rem; padding: 4px 14px; box-shadow: 0 3px 0 var(--bark); }
.choices .pill.fd { display: inline-flex; align-items: center; gap: 2px; padding: 2px 10px; }
.choices .pill.fd span { font-size: 1.6rem; }
.next { position: absolute; right: 12px; bottom: 12px; z-index: 9; font-size: 1.25rem; padding: 6px 18px; box-shadow: 0 4px 0 var(--bark); animation: nudge 1.8s ease-in-out infinite; }
.thing { position: absolute; transform: translateX(-50%); border: 0; background: none; padding: 0; line-height: 1; cursor: pointer; z-index: 4; }
.thing.pop-in { animation: popin2 .4s ease-out; }
@keyframes popin2 { from { scale: 0; } }
.thing.shake { animation: wig2 .35s; }
@keyframes wig2 { 25% { rotate: -8deg; } 75% { rotate: 8deg; } }
.bush { width: 150px; height: 108px; border-radius: 70px 70px 26px 26px; background: radial-gradient(circle at 30% 30%, #7ccc58, #3f8a2f 70%); border: 4px solid #2f6a24; cursor: default; }
.berry { position: absolute; font-size: 1.9rem; border: 0; background: none; padding: 0; cursor: pointer; line-height: 1; }
.tree { width: 170px; height: 190px; }
.tree .crown { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10.5rem; line-height: 1; text-align: center; pointer-events: none; }
.tree .fruit { position: absolute; font-size: 1.9rem; border: 0; background: none; padding: 0; line-height: 1; pointer-events: none; transition: top .6s cubic-bezier(.5,0,1,.6), left .6s; z-index: 2; }
.tree .fruit.down { pointer-events: auto; cursor: pointer; }
.tree.shake { animation: wig2 .35s; }
.dmound { width: 120px; height: 66px; border-radius: 60px 60px 10px 10px; background: radial-gradient(circle at 40% 30%, #b0784a, #6b4329); transition: transform .2s; transform-origin: bottom; font-size: 1.4rem; }
.puddle { width: 160px; height: 36px; border-radius: 50%; background: radial-gradient(#8fd0f5, #4a90c4); border: 3px solid #2f6a9a; cursor: default; }
.friend { font-size: 5rem; animation: bob 1.6s ease-in-out infinite, enter .7s ease-out; }
.friend.happy { animation: fjump .55s ease-out; }
@keyframes fjump { 40% { translate: 0 -34px; } }
@keyframes bob { 50% { translate: 0 -6px; } }
@keyframes enter { from { margin-left: 320px; opacity: 0; } }
.leafpile { font-size: 3rem; }
.mover { font-size: 2.8rem; transition: left .75s ease-in-out, bottom .75s ease-in-out; z-index: 7; }
.cloud { font-size: 5rem; transition: left 1.4s ease-in, opacity 1.4s; z-index: 7; }
.rainbow { font-size: 6rem; pointer-events: none; animation: popin2 .8s ease-out; }
.sparkle { font-size: 2.6rem; animation: twinkle .6s infinite alternate; }
.found { position: absolute; transform: translate(-50%, -50%); font-size: 3.4rem; z-index: 6; pointer-events: none; animation: foundpop 1.6s ease-out forwards; }
@keyframes foundpop { 0% { scale: 0; } 20% { scale: 1.3; } 30% { scale: 1; } 80% { opacity: 1; translate: 0 -30px; } 100% { opacity: 0; translate: 0 -50px; } }

/* album */
.album-sec { margin-bottom: 12px; }
.album-sec h3 { margin: 0 0 6px; font-size: 1.1rem; display: flex; gap: 6px; align-items: baseline; }
.album-sec h3 small { color: var(--bark); font-weight: 700; }
.stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.sticker { background: #ffffff; border: 3px dashed #d9c9ab; border-radius: 14px; display: grid; justify-items: center; padding: 4px 2px; min-width: 0; }
.sticker.got { border-style: solid; border-color: var(--leaf); }
.sticker .e { font-size: 1.9rem; line-height: 1.2; }
.sticker .n { font-size: .72rem; font-weight: 700; text-align: center; line-height: 1.1; overflow-wrap: anywhere; }
.sticker:not(.got) .e { filter: grayscale(1) brightness(0); opacity: .18; }

/* ---------- actions ---------- */
.actions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.act {
  font-weight: 800; font-size: 1rem; border: 4px solid var(--bark); border-radius: 20px; background: var(--paper);
  padding: 8px 2px 6px; display: grid; justify-items: center; cursor: pointer; box-shadow: 0 5px 0 var(--bark);
  transition: transform .08s, box-shadow .08s; min-width: 0; white-space: nowrap;
}
.act span { font-size: 2.1rem; line-height: 1.15; }
.act:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--bark); }
.act[aria-pressed="true"] { background: var(--sun); }
.act:disabled { opacity: .45; cursor: default; }
.act.need { animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 70%, 100% { rotate: 0deg; } 80% { rotate: -4deg; } 90% { rotate: 4deg; } }

@media (max-width: 460px) {
  .titlebar h1 { font-size: 1.5rem; }
  .iconbtn { width: 40px; height: 40px; font-size: 1.15rem; }
  .meters { grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .actions { gap: 5px; }
  .act { font-size: .78rem; border-radius: 14px; border-width: 3px; }
  .act span { font-size: 1.7rem; }
  .bubble { font-size: 1.05rem; }
  .shop-top .pv { width: 104px; }
  .tool { width: 50px; height: 50px; font-size: 1.6rem; }
  .friend { font-size: 4.2rem; }
  .tree { width: 150px; height: 170px; }
  .tree .crown { font-size: 9.4rem; }
}
@media (max-height: 560px) {
  .progress { display: none; }
  .act span { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

    async function choose(o) {
      if (!picking) return;
      picking = false; o.el.classList.add("up");
      if (o.has) { correct++; arena.querySelector(".c").textContent = correct; msg.textContent = "Tu som! Hurá!"; sfx.star(); S.happy = clamp(S.happy + 5); }
      else { msg.textContent = "Tu nie som... Som tamto!"; sfx.no(); mounds.forEach(function (m) { if (m.has) m.el.classList.add("up"); }); }
      await wait(1600); if (!alive) return;
      if (round < 3) playRound();
      else result("🦔", correct === 3 ? "Všetky 3 správne!" : "Správne: " + correct + " z 3.", correct, gameShell, openGames);
    }
    panel.cleanup = function () { alive = false; };
    playRound();
  }

  // ================= TRIP (random place, step by step) =================
  var trip = null;
  function openTrip() {
    if (S.energy < 25) { sfx.no(); anim("wiggle"); say("Som príliš unavený na výlet. Najprv spinkať! 🌙", 3500); return; }
    openScreen("Výlet");
    startTrip();
  }
  function buildSteps(p) {
    var foods = shuffle(["bush", "dig"].concat(p.tree ? ["tree"] : []));
    var extra = shuffle(["shiny", "puddle", "rain", "friend"].concat(foods.slice(2)));
    return ["friend", foods[0], foods[1], extra[0], extra[1]].sort(function () { return Math.random() - .5; });
  }
  function startTrip() {
    var options = PLACES.filter(function (p) { return p.id !== S.lastPlace; });
    var p = pick(options);
    S.lastPlace = p.id;
    S.energy = clamp(S.energy - 10); S.happy = clamp(S.happy + 5);
    setTitle(p.icon + " " + p.name); resetBody(true);
    var root = mk("div", "trip", null, panel.body); root.style.background = p.bg;
    var deco = mk("div", "deco", null, root), stage = mk("div", "stage", null, root);
    var walker = mk("div", "walker", null, root); walker.innerHTML = '<div class="flip">' + miniHog() + '</div>';
    var basket = mk("div", "gstat", null, root); basket.innerHTML = '🧺 <b>0</b>';
    var dots = mk("div", "dots", null, root);
    var choices = mk("div", "choices", null, root);
    var next = mk("button", "pill go next", "Ďalej ➜", root); next.hidden = true;
    trip = { p: p, step: -1, steps: buildSteps(p), got: {}, gotN: 0, newFriends: [], newTreasures: [], met: [], alive: true,
             root: root, deco: deco, stage: stage, walker: walker, basket: basket, dots: dots, choices: choices, next: next };
    trip.steps.forEach(function () { mk("i", null, null, dots); });
    next.addEventListener("click", walkOn);
    panel.cleanup = function () { if (trip) trip.alive = false; trip = null; };
    panel.onClose = function () { say(trip_summary_line, 3500); anim("jump"); };
    trip_summary_line = "To bol super výlet!";
    drawDeco(false);
    toast("Juchú! Dnes ideme na výlet: " + p.name + "!", 2600);
    sfx.step();
    setTimeout(function () { if (alive()) walkOn(); }, 1600);
  }
  var trip_summary_line = "To bol super výlet!";
  function alive() { return trip && trip.alive && panel; }
  function drawDeco(slideOld) {
    var old = Array.prototype.slice.call(trip.deco.children);
    old.forEach(function (el) { el.classList.add("out"); setTimeout(function () { el.remove(); }, 950); });
    for (var i = 0; i < 4; i++) {
      var d = mk("span", null, pick(trip.p.deco), trip.deco);
      d.style.left = (12 + i * 25 + Math.random() * 10) + "%";
      d.style.bottom = (40 + Math.random() * 12) + "%";
      d.style.fontSize = (2.2 + Math.random() * 1.8) + "rem";
      d.style.opacity = .85;
    }
  }
  function walkOn() {
    if (!alive()) return;
    trip.next.hidden = true; trip.choices.innerHTML = "";
    trip.stage.innerHTML = "";
    trip.walker.style.left = "18%"; trip.walker.classList.remove("left");
    trip.step++;
    Array.prototype.forEach.call(trip.dots.children, function (d, i) { d.classList.toggle("on", i < trip.step + 1 && trip.step < trip.steps.length); });
    if (trip.step >= trip.steps.length) { endTrip(); return; }
    S.energy = clamp(S.energy - 2); S.hunger = clamp(S.hunger - 2); render();
    drawDeco(true);
    trip.walker.classList.remove("step"); void trip.walker.offsetWidth; trip.walker.classList.add("step");
    sfx.step();
    setTimeout(function () { if (alive()) ENC[trip.steps[trip.step]](stepDone); }, 950);
  }
  function stepDone() {
    if (!alive()) return;
    trip.choices.innerHTML = "";
    trip.next.textContent = trip.step >= trip.steps.length - 1 ? "Domov ➜" : "Ďalej ➜";
    trip.next.hidden = false;
    save();
  }
  function thing(cls, text, x, bottom) {
    var el = mk("button", "thing " + cls, text, trip.stage);
    el.style.left = x + "%"; el.style.bottom = bottom + "%";
    return el;
  }
  function moveWalker(x) {
    var cur = parseFloat(trip.walker.style.left) || 18;
    trip.walker.classList.toggle("left", x < cur);
    trip.walker.style.left = x + "%";
    trip.walker.classList.remove("step"); void trip.walker.offsetWidth; trip.walker.classList.add("step");
  }
  function addFood(id, fromEl) {
    S.food[id] = (S.food[id] || 0) + 1;
    trip.got[id] = (trip.got[id] || 0) + 1; trip.gotN++;
    sfx.pop();
    var r = fromEl.getBoundingClientRect(), b = trip.basket;
    flyEmoji(trip.root, FOODS[id].e, r, b.getBoundingClientRect(), function () {
      if (!alive()) return;
      b.querySelector("b").textContent = trip.gotN;
      b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump");
    });
  }
  function giftFood(id, n, fromEl) {
    for (var i = 0; i < n; i++) setTimeout(function () { if (alive()) addFood(id, fromEl); }, i * 250);
  }
  function giveTreasure(id, fromEl) {
    var t = TREASURES[id];
    var pop = mk("div", "found", t.e, trip.stage);
    var r = fromEl.getBoundingClientRect(), c = trip.root.getBoundingClientRect();
    pop.style.left = (r.left - c.left + r.width / 2) + "px"; pop.style.top = (r.top - c.top) + "px";
    setTimeout(function () { pop.remove(); }, 1700);
    if (!S.treasures[id]) {
      S.treasures[id] = true; trip.newTreasures.push(id);
      toast("Poklad: " + t.e + " " + t.n + "! Ide do zbierky 📒", 3000);
      giveStar(1);
      return true;
    }
    toast(t.e + " " + t.n + " už máme. Tu je aspoň jabĺčko!", 2500);
    giftFood("apple", 1, fromEl);
    return false;
  }

  var ENC = {
    bush: function (done) {
      var f = trip.p.bush, b = thing("bush pop-in", "", 64, 14);
      toast("Pozri, kríček! Natrhaj " + FOODS[f].e + " – ťukaj na ne.", 3000);
      var spots = [[18, 22], [52, 14], [84, 26], [32, 52], [70, 50]], left = spots.length;
      spots.forEach(function (s) {
        var be = mk("button", "berry", FOODS[f].e, b);
        be.style.left = "calc(" + s[0] + "% - 14px)"; be.style.top = "calc(" + s[1] + "% - 4px)";
        be.setAttribute("aria-label", "Odtrhnúť");
        be.addEventListener("click", function (e) {
          e.stopPropagation(); addFood(f, be); be.remove(); left--;
          if (left === 0) { toast("Kríček je obratý! Mňam.", 2000); done(); }
        });
      });
    },
    tree: function (done) {
      var f = pick(trip.p.tree), t = thing("tree pop-in", "", 66, 10), shakes = 0;
      t.setAttribute("aria-label", "Strom");
      mk("span", "crown", "🌳", t);
      var spots = [[30, 18], [58, 12], [44, 34], [74, 30]];
      var fruits = spots.map(function (s) {
        var fr = mk("button", "fruit", FOODS[f].e, t);
        fr.style.left = s[0] + "%"; fr.style.top = s[1] + "%";
        return fr;
      });
      toast("Strom plný " + FOODS[f].e + "! Zatras ním – ťukni 3×.", 3000);
      var left = fruits.length;
      t.addEventListener("click", function () {
        if (shakes >= 3) return;
        shakes++; sfx.dig();
        t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
        moveWalker(46);
        if (shakes === 3) {
          sfx.boing();
          fruits.forEach(function (fr, i) {
            setTimeout(function () {
              fr.style.top = (86 + rnd(8)) + "%"; fr.style.left = (i * 26 - 10 + rnd(8)) + "%";
              fr.classList.add("down");
            }, i * 120);
            fr.addEventListener("click", function (e) {
              e.stopPropagation(); if (!fr.classList.contains("down")) return;
              addFood(f, fr); fr.remove(); left--;
              if (left === 0) { toast("Všetko pozbierané!", 1800); done(); }
            });
          });
          toast("Spadli! Pozbieraj ich.", 2200);
        }
      });
    },
    dig: function (done) {
      var f = pick(trip.p.dig), m = thing("dmound pop-in", "✨", 62, 12), digs = 0;
      m.setAttribute("aria-label", "Hrabať");
      toast("Tu niečo voňia! Hrabaj – ťukaj 4×.", 2800);
      moveWalker(42);
      m.addEventListener("click", function () {
        if (digs >= 4) return;
        digs++; sfx.dig();
        m.style.transform = "translateX(-50%) scaleY(" + (1 - digs * .2) + ")";
        var r = m.getBoundingClientRect(), c = trip.root.getBoundingClientRect();
        fx("💨", r.left - c.left + rnd(r.width), r.top - c.top, null, trip.root);
        if (digs === 4) {
          m.remove();
          var n = 2, left = n;
          toast("Našli sme " + FOODS[f].n.toLowerCase() + "! Pozbieraj.", 2500);
          for (var i = 0; i < n; i++) {
            var it = thing("pop-in", FOODS[f].e, 56 + i * 12, 12);
            it.style.fontSize = "2.6rem";
            it.addEventListener("click", function (e) { var el = e.currentTarget; addFood(f, el); el.remove(); left--; if (!left) done(); });
          }
        }
      });
    },
    shiny: function (done) {
      var s = thing("sparkle pop-in", "✨", 66, 16);
      s.setAttribute("aria-label", "Niečo sa blyští");
      toast("Niečo sa tam blyští! Ťukni.", 2500);
      s.addEventListener("click", function () {
        if (s.disabled) return; s.disabled = true;
        moveWalker(52);
        setTimeout(function () {
          if (!alive()) return;
          var ids = Object.keys(TREASURES), fresh = ids.filter(function (k) { return !S.treasures[k]; });
          giveTreasure(fresh.length ? pick(fresh) : pick(ids), s);
          s.textContent = ""; done();
        }, 650);
      });
    },
    puddle: function (done) {
      thing("puddle pop-in", "", 52, 9);
      toast("Ojoj, mláka! Čo urobí Ježko?", 3000);
      var a = mk("button", "pill", "🦘 Preskočiť", trip.choices), b = mk("button", "pill", "💦 Čľup do nej!", trip.choices);
      a.addEventListener("click", function () {
        trip.choices.innerHTML = ""; sfx.boing();
        trip.walker.classList.add("bigjump"); moveWalker(80);
        setTimeout(function () { if (!alive()) return; trip.walker.classList.remove("bigjump"); toast("Hop! Suché labky!", 2000); S.happy = clamp(S.happy + 3); done(); }, 850);
      });
      b.addEventListener("click", function () {
        trip.choices.innerHTML = ""; moveWalker(52);
        setTimeout(function () {
          if (!alive()) return;
          sfx.splash();
          var c = trip.root.getBoundingClientRect(), w = trip.walker.getBoundingClientRect();
          for (var i = 0; i < 6; i++) fx("💦", w.left - c.left + rnd(w.width), w.top - c.top + rnd(30), null, trip.root);
          S.clean = clamp(S.clean - 25); S.happy = clamp(S.happy + 8); render();
          toast("Čľup! Hihi, som celý zablatený! Doma ma okúpeš 🛁", 3000);
          done();
        }, 650);
      });
    },
    rain: function (done) {
      var cl = thing("cloud pop-in", "🌧️", 62, 62), taps = 0;
      cl.setAttribute("aria-label", "Mráčik");
      toast("Prší! Ťukaj na mráčik, nech odletí.", 3000);
      var rainT = setInterval(function () {
        if (!alive() || taps >= 5) { clearInterval(rainT); return; }
        var r = cl.getBoundingClientRect(), c = trip.root.getBoundingClientRect();
        fx("💧", r.left - c.left + rnd(r.width), r.bottom - c.top, "drip", trip.root);
      }, 250);
      cl.addEventListener("click", function () {
        if (taps >= 5) return;
        taps++; sfx.pop();
        cl.style.left = (62 - taps * 4) + "%";
        if (taps === 5) {
          clearInterval(rainT); sfx.boing();
          cl.style.left = "-30%"; cl.style.opacity = 0;
          setTimeout(function () {
            if (!alive()) return;
            thing("rainbow", "🌈", 60, 50);
            S.happy = clamp(S.happy + 6); sfx.star();
            toast("Dúha! Aká krásna!", 2500); done();
          }, 900);
        }
      });
    },
    friend: function (done) {
      var pool = trip.p.friends.filter(function (id) { return trip.met.indexOf(id) < 0; });
      var fresh = pool.filter(function (id) { return !S.friends[id]; });
      var id = pick(fresh.length ? fresh : pool), f = FRIENDS[id];
      trip.met.push(id);
      var el = thing("friend", f.e, 70, 12); el.setAttribute("aria-label", f.n);
      sfx.hello();
      toast(f.e + " " + f.n + ": " + f.hi, 3600);
      function finish() {
        el.classList.remove("happy"); void el.offsetWidth; el.classList.add("happy");
        var c = trip.root.getBoundingClientRect(), r = el.getBoundingClientRect();
        for (var i = 0; i < 3; i++) fx("❤️", r.left - c.left + rnd(r.width), r.top - c.top, null, trip.root);
        sfx.star();
        var isNew = !S.friends[id];
        S.friends[id] = (S.friends[id] || 0) + 1; S.happy = clamp(S.happy + 8);
        toast(f.e + " " + f.thanks + (isNew ? " Nový kamarát v zbierke!" : ""), 3600);
        if (isNew) { trip.newFriends.push(id); setTimeout(function () { giveStar(1); }, 600); }
        if (f.reward && f.reward.food) giftFood(f.reward.food, f.reward.n, el);
        if (f.reward && f.reward.treasure) setTimeout(function () { if (!alive()) return; if (S.treasures[f.reward.treasure]) giftFood("apple", 1, el); else { S.treasures[f.reward.treasure] = true; trip.newTreasures.push(f.reward.treasure); var pop = mk("div", "found", TREASURES[f.reward.treasure].e, trip.stage); pop.style.left = el.style.left; pop.style.bottom = "40%"; setTimeout(function () { pop.remove(); }, 1700); } }, 300);
        setTimeout(function () { if (alive()) done(); }, 900);
      }
      setTimeout(function () { if (alive()) TASKS[f.task](f, el, finish); }, 900);
    }
  };

  var TASKS = {
    give: function (f, el, finish) {
      var left = 3;
      moveWalker(40);
      for (var i = 0; i < 3; i++) {
        var it = thing("pop-in", FOODS[f.item].e, 44 + i * 9, 6 + rnd(6)); it.style.fontSize = "2.4rem";
        it.addEventListener("click", function (e) { var x = e.currentTarget; addFood(f.item, x); x.remove(); left--; if (!left) finish(); });
      }
    },
    pet: function (f, el, finish) {
      var n = 0;
      moveWalker(52);
      el.addEventListener("click", function () {
        if (n >= 5) return;
        n++; sfx.pet();
        var c = trip.root.getBoundingClientRect(), r = el.getBoundingClientRect();
        fx("💗", r.left - c.left + rnd(r.width), r.top - c.top, null, trip.root);
        if (n === 5) finish();
      });
    },
    gift: function (f, el, finish) {
      moveWalker(46);
      var ids = FOOD_ORDER.filter(function (id) { return id === "kibble" || S.food[id] > 0; });
      ids.forEach(function (id) {
        var b = mk("button", "pill fd", null, trip.choices);
        b.innerHTML = "<span></span>"; b.firstChild.textContent = FOODS[id].e;
        b.appendChild(document.createTextNode(id === "kibble" ? "" : "×" + S.food[id]));
        b.setAttribute("aria-label", "Darovať " + FOODS[id].n);
        b.addEventListener("click", function () {
          if (id !== "kibble") { if (!(S.food[id] > 0)) return; S.food[id]--; }
          trip.choices.innerHTML = "";
          flyEmoji(trip.root, FOODS[id].e, b.getBoundingClientRect(), el.getBoundingClientRect(), function () { if (alive()) { sfx.eat(); finish(); } });
        });
      });
      toast("Vyber, čo darujeme " + f.e + " (dole)", 2600);
    },
    seek: function (f, el, finish) {
      var spots = shuffle([[30, 8], [44, 24], [56, 6], [84, 30], [92, 8], [20, 26]]).slice(0, 5);
      var has = shuffle([true, true, true, false, false]), left = 3;
      spots.forEach(function (s, i) {
        var lp = thing("leafpile pop-in", pick(["🍂", "🌿", "🍁"]), s[0], s[1]);
        lp.setAttribute("aria-label", "Pozrieť pod lístie");
        lp.addEventListener("click", function () {
          if (lp.disabled) return; lp.disabled = true;
          moveWalker(Math.max(10, s[0] - 8));
          lp.classList.add("shake");
          setTimeout(function () {
            if (!alive()) return;
            if (has[i]) { lp.textContent = f.item; sfx.pop(); left--; if (!left) finish(); else toast("Našli sme! Ešte " + left + ".", 1500); }
            else { lp.textContent = "💨"; lp.style.opacity = .4; sfx.flip(); }
          }, 400);
        });
      });
    },
    catch: function (f, el, finish) {
      var m = f.self ? el : thing("mover pop-in", f.item, 50, 30), n = 0;
      if (f.self) el.classList.add("mover");
      m.setAttribute("aria-label", "Chytiť");
      function hop() { m.style.left = (30 + rnd(60)) + "%"; m.style.bottom = (14 + rnd(46)) + "%"; }
      var timer = setInterval(function () { if (!alive() || n >= 4) { clearInterval(timer); return; } hop(); }, 1000);
      m.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        if (n >= 4) return;
        n++; sfx.pop();
        var c = trip.root.getBoundingClientRect(), r = m.getBoundingClientRect();
        fx("✨", r.left - c.left, r.top - c.top, null, trip.root);
        if (n === 4) { clearInterval(timer); if (!f.self) m.remove(); else { el.style.left = "70%"; el.style.bottom = "12%"; } finish(); }
        else { toast("Mám! Ešte " + (4 - n) + ".", 1200); hop(); }
      });
    }
  };

  function endTrip() {
    var got = Object.keys(trip.got).map(function (id) { return FOODS[id].e + "×" + trip.got[id]; }).join("  ");
    var lines = (got ? "Nazbierali sme: " + got : "Tentoraz bez jedla.");
    var extras = trip.newFriends.map(function (id) { return FRIENDS[id].e; }).concat(trip.newTreasures.map(function (id) { return TREASURES[id].e; }));
    if (extras.length) lines += "\nNové v zbierke: " + extras.join(" ");
    giveStar(1);
    trip_summary_line = got ? "Super výlet! Máme plný košík!" : "To bol super výlet!";
    var canGo = S.energy >= 25;
    var card = resultCard("🧺", lines + "  +1 ⭐", [
      [canGo ? "🎒 Ďalší výlet" : "😴 Ježko je unavený", function () { if (S.energy >= 25) startTrip(); }, "go", !canGo],
      ["🏠 Domov", function () { var f = panel.onClose; closeScreen(); if (f) f(); }]
    ]);
    card.querySelector("p").style.whiteSpace = "pre-line";
    if (extras.length) confetti();
  }

  // ================= ALBUM =================
  function openAlbum() {
    var fc = Object.keys(FRIENDS).filter(function (k) { return S.friends[k]; }).length;
    var tc = Object.keys(TREASURES).filter(function (k) { return S.treasures[k]; }).length;
    openScreen("Zbierka"); resetBody(false);
    [["🐾 Kamaráti", FRIENDS, S.friends, fc], ["💎 Poklady", TREASURES, S.treasures, tc]].forEach(function (sec) {
      var box = mk("div", "album-sec", null, panel.body);
      var h = mk("h3", null, null, box); mk("span", null, sec[0], h); mk("small", null, sec[3] + "/" + Object.keys(sec[1]).length, h);
      var g = mk("div", "stickers", null, box);
      Object.keys(sec[1]).forEach(function (k) {
        var got = !!sec[2][k], d = mk("div", "sticker" + (got ? " got" : ""), null, g);
        mk("span", "e", sec[1][k].e, d); mk("span", "n", got ? sec[1][k].n : "?", d);
      });
    });
    var foods = mk("div", "album-sec", null, panel.body);
    var h = mk("h3", null, null, foods); mk("span", null, "🧺 Zásoby jedla", h); mk("small", null, foodTotal() + " ks", h);
    var g = mk("div", "stickers", null, foods);
    FOOD_ORDER.forEach(function (id) {
      if (id === "kibble") return;
      var n = S.food[id] || 0, d = mk("div", "sticker" + (n ? " got" : ""), null, g);
      mk("span", "e", FOODS[id].e, d); mk("span", "n", FOODS[id].n + " ×" + n, d);
    });
  }

  // ================= BUTTONS =================
  $("btnFeed").addEventListener("click", function () { if (mode === "feed") closeTray(); else if (mode === "idle") openTray(); });
  $("btnPlay").addEventListener("click", function () { if (mode === "feed") closeTray(); if (mode === "play") endPlay(); else if (mode === "idle") openGames(); });
  $("btnBath").addEventListener("click", function () { if (mode === "feed") closeTray(); if (mode === "bath") endBath(false); else if (mode === "idle") startBath(); });
  $("btnSleep").addEventListener("click", function () { if (mode === "feed") closeTray(); if (mode === "sleep") wake(false); else if (mode === "idle") startSleep(); });
  $("btnTrip").addEventListener("click", function () { if (mode === "feed") closeTray(); if (mode === "idle") openTrip(); });
  $("shopBtn").addEventListener("click", function () { if (mode === "idle" || mode === "feed") openShop(); });
  $("albumBtn").addEventListener("click", function () { if (mode === "idle" || mode === "feed") openAlbum(); });
  $("soundBtn").addEventListener("click", function () { S.sound = !S.sound; render(); save(); if (S.sound) sfx.pet(); });

  render();
  setTimeout(function () { say("Ahoj! Ja som Ježko! Postaráš sa o mňa?", 4000); }, 300);
})();
