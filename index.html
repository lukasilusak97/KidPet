<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ježko</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen app — status meters on top, meadow scene in the middle (shop, games, trips and album open as panels over it), big care buttons at the bottom. Single deliberate daylight-meadow look; night is an in-game state. */
:root {
  --sky-top: #bfe6f5;
  --sky-bottom: #eaf7e4;
  --night-top: #1d2a4d;
  --night-bottom: #3c4f7a;
  --ink: #3a2618;
  --paper: #fffaf0;
  --bark: #8a5a3b;
  --berry: #e2504c;
  --sun: #ffc83d;
  --leaf: #4f9a3a;
  --soft: #f3e6cf;
  --sea: #5aa7e0;
  --font: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky-bottom); color: var(--ink); font-family: var(--font);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overflow: hidden;
}
button { font-family: inherit; color: var(--ink); }
.app {
  height: 100%; display: grid; grid-template-rows: auto 1fr auto; max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; gap: 10px; box-sizing: border-box;
}

/* ---------- top bar ---------- */
.top { display: grid; gap: 8px; }
.titlebar { display: flex; align-items: center; gap: 6px; }
.titlebar h1 { margin: 0; font-size: 1.9rem; font-weight: 800; line-height: 1; color: var(--bark); flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; background: var(--paper); border: 3px solid var(--bark);
  border-radius: 999px; padding: 2px 12px; font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums;
}
.chip.bump { animation: bump .4s; }
@keyframes bump { 50% { transform: scale(1.25); } }
.iconbtn {
  font-size: 1.3rem; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--bark);
  background: var(--paper); cursor: pointer; padding: 0; display: grid; place-items: center; flex: none;
}
.iconbtn:disabled { opacity: .45; cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.meter { background: var(--paper); border: 3px solid var(--bark); border-radius: 14px; padding: 4px 8px 6px; display: grid; gap: 2px; min-width: 0; }
.meter .lbl { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: .9rem; white-space: nowrap; overflow: hidden; }
.meter .lbl b { font-size: 1.1rem; }
.bar { height: 12px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; width: 50%; border-radius: 99px; background: var(--leaf); transition: width .4s, background-color .4s; }
.bar i.mid { background: var(--sun); }
.bar i.low { background: var(--berry); animation: blinkbar 1s infinite; }
@keyframes blinkbar { 50% { opacity: .45; } }
.progress { font-size: .95rem; font-weight: 700; text-align: center; color: var(--bark); }

/* ---------- scene ---------- */
.scene {
  position: relative; border-radius: 24px; overflow: hidden; min-height: 0;
  background: linear-gradient(var(--sky-top), var(--sky-bottom) 70%); border: 4px solid var(--bark);
  transition: background .8s; touch-action: none;
}
.scene.night { background: linear-gradient(var(--night-top), var(--night-bottom) 75%); }
.scene .sun, .scene .moon { position: absolute; top: 14px; right: 18px; width: 54px; height: 54px; border-radius: 50%; transition: opacity .8s, transform .8s; }
.scene .sun { background: var(--sun); box-shadow: 0 0 0 10px rgba(255,200,61,.3); }
.scene .moon { background: var(--paper); box-shadow: inset -12px -4px 0 0 #d9d2bd; opacity: 0; transform: translateY(20px); }
.scene.night .sun { opacity: 0; transform: translateY(20px); }
.scene.night .moon { opacity: 1; transform: none; }
.stars-sky { position: absolute; inset: 0; opacity: 0; transition: opacity .8s; pointer-events: none; }
.scene.night .stars-sky { opacity: 1; }
.stars-sky span { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--paper); animation: twinkle 2s infinite alternate; }
@keyframes twinkle { to { opacity: .2; } }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; }
.ground svg { width: 100%; height: 100%; display: block; }
.night-veil { position: absolute; inset: 0; background: #0b1230; opacity: 0; pointer-events: none; transition: opacity .8s; }
.scene.night .night-veil { opacity: .28; }
.hogwrap { position: absolute; left: 50%; bottom: 8%; width: min(78%, 420px); transform: translateX(-50%); aspect-ratio: 340 / 260; max-width: 100%; cursor: pointer; }
.hogwrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
svg .hogg { transform-origin: 160px 240px; }
#hogsvg .hogg { animation: breathe 3s ease-in-out infinite; }
#hogsvg .hogg.jump { animation: jump .55s ease-out; }
#hogsvg .hogg.wiggle { animation: wiggle .5s ease-in-out; }
#hogsvg .hogg.chew { animation: chew .25s ease-in-out 4; }
.night #hogsvg .hogg { animation: breathe 4.5s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.015, 1.035); } }
@keyframes jump { 40% { transform: translateY(-34px) scale(.98,1.04); } 75% { transform: translateY(0) scale(1.05,.95); } }
@keyframes wiggle { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
@keyframes chew { 50% { transform: scale(1.02, .97); } }
.eyes-closed, .mouth-open { display: none; }
.sleepy .eyes-open, .blink .eyes-open { display: none; }
.sleepy .eyes-closed, .blink .eyes-closed { display: inline; }
.eating .mouth-open { display: inline; }
.eating .mouth { display: none; }

.bubble {
  position: absolute; left: 50%; top: 6%; transform: translateX(-50%); background: var(--paper);
  border: 3px solid var(--bark); border-radius: 20px; padding: 6px 16px; font-weight: 800; font-size: 1.25rem;
  white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -12px; width: 18px; height: 18px; background: var(--paper);
  border-right: 3px solid var(--bark); border-bottom: 3px solid var(--bark); transform: translateX(-50%) rotate(45deg);
}
.bubble.pop { animation: popin .35s ease-out; }
@keyframes popin { from { transform: translateX(-50%) scale(.6); } }
.fx { position: absolute; pointer-events: none; font-size: 2rem; animation: floatup 1.4s ease-out forwards; z-index: 30; }
@keyframes floatup { to { transform: translateY(-110px) scale(1.3); opacity: 0; } }
.fx.bub { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #ffffff; background: rgba(190,230,255,.55); font-size: 0; }
.target { position: absolute; font-size: 2.6rem; border: 0; background: none; cursor: pointer; padding: 6px; animation: appear .3s ease-out; z-index: 6; line-height: 1; }
@keyframes appear { from { transform: scale(0); } }
.target.gone { animation: vanish .3s forwards; }
@keyframes vanish { to { transform: scale(0); opacity: 0; } }
.sponge { position: absolute; font-size: 2.6rem; pointer-events: none; z-index: 7; transform: translate(-50%, -50%); }
.hint {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: var(--paper);
  border: 3px solid var(--bark); border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 1.05rem; white-space: nowrap; z-index: 8;
}
.foodtray {
  position: absolute; left: 50%; top: calc(6% + 64px); transform: translateX(-50%); display: flex; gap: 8px;
  background: var(--paper); border: 3px solid var(--bark); border-radius: 22px; padding: 8px; z-index: 8; animation: popup .25s ease-out;
}
@keyframes popup { from { transform: translate(-50%, -20px); opacity: 0; } }
.food { display: grid; justify-items: center; border: 3px solid var(--soft); background: #ffffff; border-radius: 16px; padding: 4px 10px; cursor: pointer; font-weight: 700; font-size: .85rem; }
.food span { font-size: 2.2rem; line-height: 1.1; }
.flying { position: absolute; font-size: 2.4rem; z-index: 9; pointer-events: none; transition: left .6s ease-in, top .6s cubic-bezier(.3,-0.6,.7,1), transform .6s; }
.confetti { position: fixed; width: 10px; height: 14px; top: -20px; z-index: 100; pointer-events: none; animation: fall 2.4s linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* ---------- panels (shop, games, trips, album) ---------- */
.screen { position: absolute; inset: 0; z-index: 20; background: var(--paper); display: flex; flex-direction: column; animation: slidein .25s ease-out; }
@keyframes slidein { from { transform: translateY(30px); opacity: 0; } }
.screen-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--soft); border-bottom: 3px solid var(--bark); }
.screen-head h2 { margin: 0; flex: 1; font-size: 1.4rem; font-weight: 800; line-height: 1.1; color: var(--bark); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill {
  border: 3px solid var(--bark); background: var(--paper); border-radius: 999px; padding: 2px 12px;
  font-weight: 800; font-size: 1rem; cursor: pointer; white-space: nowrap;
}
.pill.go { background: var(--sun); }
.pill:disabled { opacity: .5; cursor: default; }
.screen-body { flex: 1; overflow: auto; padding: 12px; position: relative; min-height: 0; }
.screen-body.flush { padding: 0; overflow: hidden; }
.toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 15; background: var(--paper);
  border: 3px solid var(--bark); border-radius: 18px; padding: 4px 14px; font-weight: 800; font-size: 1.1rem;
  max-width: 88%; text-align: center; pointer-events: none;
}
.toast.pop { animation: popin .35s ease-out; }
.minihog { display: block; width: 100%; height: auto; overflow: visible; }

/* games menu */
.gamegrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.gamecard {
  border: 4px solid var(--bark); border-radius: 20px; background: #ffffff; padding: 10px 8px; cursor: pointer;
  display: grid; justify-items: center; gap: 2px; text-align: center; box-shadow: 0 4px 0 var(--bark);
}
.gamecard:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--bark); }
.gamecard .ico { font-size: 2.6rem; line-height: 1.1; }
.gamecard b { font-size: 1.15rem; }
.gamecard small { font-size: .85rem; line-height: 1.2; color: var(--bark); font-weight: 600; }

/* result card */
.result {
  position: absolute; inset: 0; z-index: 16; display: grid; place-items: center; background: rgba(255,250,240,.86); padding: 16px;
}
.result .card { background: #ffffff; border: 4px solid var(--bark); border-radius: 22px; padding: 16px 20px; text-align: center; display: grid; gap: 8px; max-width: 320px; animation: popup2 .3s ease-out; }
@keyframes popup2 { from { transform: scale(.8); opacity: 0; } }
.result .big { font-size: 2.6rem; line-height: 1.1; }
.result p { margin: 0; font-weight: 800; font-size: 1.2rem; }
.result .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* pexeso */
.memo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 420px; margin: 0 auto; }
.memo button {
  aspect-ratio: 1; border-radius: 16px; border: 3px solid var(--bark); cursor: pointer; padding: 0; font-size: 2rem;
  background: var(--leaf); color: transparent; position: relative; transition: transform .25s, background-color .25s;
}
.memo button::after { content: "?"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--paper); font-weight: 800; font-size: 1.8rem; }
.memo button.open, .memo button.done { background: #ffffff; color: var(--ink); transform: rotateY(180deg) scaleX(-1); }
.memo button.open::after, .memo button.done::after { content: none; }
.memo button.done { border-color: var(--leaf); }
.memo-stat { text-align: center; font-weight: 800; margin-bottom: 8px; font-size: 1.1rem; }

/* arena games */
.arena { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(var(--sky-top), var(--sky-bottom) 75%, #9bd27a 75%); touch-action: none; }
.gstat { position: absolute; left: 10px; top: 8px; z-index: 5; background: var(--paper); border: 3px solid var(--bark); border-radius: 999px; padding: 2px 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.arena-hog { position: absolute; bottom: 6px; width: 96px; transform: translateX(-50%); }
.arena-hog.hit { animation: wiggle .4s; }
.faller { position: absolute; font-size: 2.3rem; line-height: 1; transform: translate(-50%, -50%); pointer-events: none; }
.mound { position: absolute; bottom: 22%; width: 28%; max-width: 140px; aspect-ratio: 1.1; transform: translateX(-50%); transition-property: left; transition-timing-function: ease-in-out; }
.mound .mhog { position: absolute; left: 6%; right: 6%; bottom: 0; }
.mound .cover {
  position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; border-radius: 50% 50% 14px 14px / 70% 70% 14px 14px;
  background: radial-gradient(circle at 35% 30%, #c98a4a, #8a5a3b 70%); border-bottom: 6px solid #5e3b24;
  transition: transform .35s ease-out; font-size: 1.7rem; display: grid; place-items: center;
}
.mound.up .cover { transform: translateY(-75%); }
.shell-msg { position: absolute; left: 0; right: 0; top: 46px; text-align: center; font-weight: 800; font-size: 1.25rem; z-index: 5; }

/* shop */
.shop-top { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; background: var(--soft); border-radius: 18px; padding: 8px 12px; }
.shop-top .pv { width: 130px; flex: none; }
.shop-top .info { display: grid; gap: 4px; min-width: 0; }
.shop-top .info b { font-size: 1.25rem; line-height: 1.1; }
.shop-top .info span { font-weight: 600; color: var(--bark); }
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
.item {
  border: 3px solid var(--soft); border-radius: 16px; background: #ffffff; cursor: pointer; padding: 4px 4px 2px;
  display: grid; justify-items: center; gap: 0; position: relative; min-width: 0;
}
.item.sel { border-color: var(--sun); box-shadow: 0 0 0 3px var(--sun); }
.item .thumb { width: 100%; aspect-ratio: 1.25; }
.item .thumb { overflow: hidden; border-radius: 10px; background: var(--soft); }
.item .thumb svg { width: 100%; height: 100%; overflow: hidden; }
.flush .toast { top: 50px; }
.item .nm { font-weight: 700; font-size: .85rem; line-height: 1.1; text-align: center; }
.item .pr { font-weight: 800; font-size: .9rem; }
.item .pr.owned { color: var(--leaf); }
.item .worn { position: absolute; top: 4px; right: 4px; background: var(--leaf); color: #ffffff; border-radius: 999px; font-size: .7rem; font-weight: 800; padding: 0 6px; }
.slot-title { font-weight: 800; color: var(--bark); margin: 10px 0 4px; font-size: 1rem; }

/* map & places */
.map { position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, #e9f7ff, transparent 40%), linear-gradient(#c9ebf7, #b6e09a 45%, #8fca6a); }
.map svg.path { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 0; border: 0; background: none; cursor: pointer; padding: 0; z-index: 2; }
.node .dot { width: 62px; height: 62px; border-radius: 50%; background: var(--paper); border: 4px solid var(--bark); display: grid; place-items: center; font-size: 2rem; box-shadow: 0 4px 0 var(--bark); }
.node .nm { font-weight: 800; background: var(--paper); border-radius: 999px; padding: 0 8px; margin-top: 4px; font-size: .95rem; border: 2px solid var(--bark); white-space: nowrap; }
.node.locked .dot { background: #d9d2c4; filter: grayscale(1); }
.node.locked .nm { opacity: .7; }
.node .cnt { font-size: .75rem; font-weight: 800; color: var(--bark); background: var(--paper); border-radius: 999px; padding: 0 6px; margin-top: 2px; }
.map-hog { position: absolute; width: 58px; transform: translate(-50%, -110%); z-index: 3; pointer-events: none; transition: left .6s, top .6s; }
.place { position: absolute; inset: 0; overflow: hidden; }
.spot { position: absolute; transform: translate(-50%, -50%); font-size: 3rem; line-height: 1; border: 0; background: none; cursor: pointer; padding: 4px; z-index: 2; }
.spot.shake { animation: wiggle .4s 2; }
.spot.searched { opacity: .35; cursor: default; }
.walker { position: absolute; bottom: 4%; width: 84px; transform: translateX(-50%); transition: left .6s ease-in-out; z-index: 3; pointer-events: none; }
.walker .flip { transition: transform .2s; }
.walker.left .flip { transform: scaleX(-1); }
.walker.step .flip { animation: hop .3s 2; }
@keyframes hop { 50% { translate: 0 -8px; } }
.found { position: absolute; transform: translate(-50%, -50%); font-size: 3.4rem; z-index: 6; pointer-events: none; animation: foundpop 1.6s ease-out forwards; }
@keyframes foundpop { 0% { scale: 0; } 20% { scale: 1.3; } 30% { scale: 1; } 80% { opacity: 1; translate: 0 -30px; } 100% { opacity: 0; translate: 0 -50px; } }

/* album */
.album-sec { margin-bottom: 12px; }
.album-sec h3 { margin: 0 0 6px; font-size: 1.1rem; display: flex; gap: 6px; align-items: center; }
.album-sec h3 small { color: var(--bark); font-weight: 700; }
.stickers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.sticker { background: #ffffff; border: 3px dashed #d9c9ab; border-radius: 14px; display: grid; justify-items: center; padding: 4px 2px; min-width: 0; }
.sticker.got { border-style: solid; border-color: var(--leaf); }
.sticker .e { font-size: 1.9rem; line-height: 1.2; }
.sticker .n { font-size: .72rem; font-weight: 700; text-align: center; line-height: 1.1; overflow-wrap: anywhere; }
.sticker:not(.got) .e { filter: grayscale(1) brightness(0); opacity: .18; }

/* ---------- actions ---------- */
.actions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.act {
  font-weight: 800; font-size: 1rem; border: 4px solid var(--bark); border-radius: 20px; background: var(--paper);
  padding: 8px 2px 6px; display: grid; justify-items: center; cursor: pointer; box-shadow: 0 5px 0 var(--bark);
  transition: transform .08s, box-shadow .08s; min-width: 0; white-space: nowrap;
}
.act span { font-size: 2.1rem; line-height: 1.15; }
.act:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--bark); }
.act[aria-pressed="true"] { background: var(--sun); }
.act:disabled { opacity: .45; cursor: default; }
.act.need { animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 70%, 100% { transform: none; } 80% { transform: rotate(-4deg); } 90% { transform: rotate(4deg); } }

@media (max-width: 460px) {
  .titlebar h1 { font-size: 1.5rem; }
  .iconbtn { width: 40px; height: 40px; font-size: 1.15rem; }
  .meters { grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .actions { gap: 5px; }
  .act { font-size: .78rem; border-radius: 14px; border-width: 3px; }
  .act span { font-size: 1.7rem; }
  .bubble { font-size: 1.05rem; }
  .node .dot { width: 52px; height: 52px; font-size: 1.7rem; }
  .shop-top .pv { width: 104px; }
}
@media (max-height: 560px) {
  .progress { display: none; }
  .act span { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="titlebar">
      <h1>Ježko</h1>
      <span class="chip" id="starChip" title="Hviezdičky">⭐ <span id="starCount">0</span></span>
      <button class="iconbtn" id="shopBtn" type="button" aria-label="Obchod s oblečením" title="Obchod">🛍️</button>
      <button class="iconbtn" id="albumBtn" type="button" aria-label="Zbierka nálezov" title="Zbierka">📒</button>
      <button class="iconbtn" id="soundBtn" type="button" aria-label="Vypnúť zvuk" title="Zvuk">🔊</button>
    </div>
    <div class="meters">
      <div class="meter"><div class="lbl"><b>🍎</b>Bruško</div><div class="bar"><i id="m-hunger"></i></div></div>
      <div class="meter"><div class="lbl"><b>💛</b>Radosť</div><div class="bar"><i id="m-happy"></i></div></div>
      <div class="meter"><div class="lbl"><b>⚡</b>Energia</div><div class="bar"><i id="m-energy"></i></div></div>
      <div class="meter"><div class="lbl"><b>🫧</b>Čistota</div><div class="bar"><i id="m-clean"></i></div></div>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <main class="scene" id="scene">
    <div class="stars-sky" id="skyStars"></div>
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="ground">
      <svg viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 30 Q100 0 200 22 T400 18 V100 H0 Z" fill="#5a9e3e"/>
        <path d="M0 45 Q120 20 230 40 T400 36 V100 H0 Z" fill="#7cbf5a"/>
        <g fill="#ffffff"><circle cx="40" cy="62" r="3"/><circle cx="330" cy="70" r="3"/><circle cx="270" cy="85" r="2.5"/></g>
        <g fill="#ffc83d"><circle cx="40" cy="62" r="1.2"/><circle cx="330" cy="70" r="1.2"/><circle cx="270" cy="85" r="1"/></g>
        <g fill="#e2504c"><circle cx="90" cy="80" r="3"/><circle cx="360" cy="54" r="2.6"/></g>
      </svg>
    </div>
    <div class="hogwrap" id="hogwrap" role="button" tabindex="0" aria-label="Pohladkať Ježka">
      <svg viewBox="0 0 340 260" id="hogsvg" aria-hidden="true"></svg>
    </div>
    <div class="night-veil"></div>

        if (it.y > hogTop && it.y < H - 10 && Math.abs(it.x - hx) < 48) {
          it.el.remove();
          if (it.rock) { score = Math.max(0, score - 1); sfx.no(); hogEl.classList.remove("hit"); void hogEl.offsetWidth; hogEl.classList.add("hit"); toast("Au! Kamienok!", 1200); }
          else { score++; sfx.pop(); S.happy = clamp(S.happy + 1.5); }
          sEl.textContent = score;
          return false;
        }
        if (it.y > H + 30) { it.el.remove(); return false; }
        return true;
      });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    var timer = setInterval(function () {
      time--; tEl.textContent = time;
      if (time <= 0) {
        stop();
        result("🍎", "Chytené ovocie: " + score + "!", Math.min(5, Math.floor(score / 6)), gameApples, openGames);
      }
    }, 1000);
    function stop() { alive = false; clearInterval(timer); items.forEach(function (it) { it.el.remove(); }); items = []; }
    panel.cleanup = stop;
  }

  // ---- shell game ----
  function gameShell() {
    setTitle("Kde je Ježko?"); resetBody(true); extraBtn("🎲 Hry", openGames);
    var arena = document.createElement("div"); arena.className = "arena";
    arena.innerHTML = '<div class="gstat">Kolo <b class="r">1</b>/3 · ✓ <b class="c">0</b></div><div class="shell-msg"></div>';
    panel.body.appendChild(arena);
    var msg = arena.querySelector(".shell-msg"), alive = true, correct = 0, round = 0, picking = false;
    var SLOT_X = [18, 50, 82], leafs = ["🍂", "🍁", "🍂"];
    var mounds = [0, 1, 2].map(function (i) {
      var m = document.createElement("div"); m.className = "mound"; m.style.left = SLOT_X[i] + "%";
      m.innerHTML = '<div class="mhog" hidden>' + miniHog() + '</div><button type="button" class="cover" aria-label="Kôpka lístia">' + leafs[i] + '</button>';
      arena.appendChild(m);
      var o = { el: m, slot: i, has: false };
      m.querySelector(".cover").addEventListener("click", function () { pick(o); });
      return o;
    });
    async function playRound() {
      round++; arena.querySelector(".r").textContent = round;
      var who = rnd(3);
      mounds.forEach(function (m, i) { m.has = i === who; m.el.querySelector(".mhog").hidden = !m.has; m.el.classList.remove("up"); });
      msg.textContent = "Pozri, tu som!";
      await wait(400); if (!alive) return;
      mounds[who].el.classList.add("up"); sfx.pet();
      await wait(1300); if (!alive) return;
      mounds[who].el.classList.remove("up");
      await wait(500); if (!alive) return;
      msg.textContent = "Miešam...";
      var speed = [560, 420, 320][round - 1], swaps = 3 + round * 2;
      mounds.forEach(function (m) { m.el.style.transitionDuration = speed + "ms"; });
      for (var s = 0; s < swaps; s++) {
        var a = mounds[rnd(3)], b; do { b = mounds[rnd(3)]; } while (b === a);
        var t = a.slot; a.slot = b.slot; b.slot = t;
        a.el.style.left = SLOT_X[a.slot] + "%"; b.el.style.left = SLOT_X[b.slot] + "%";
        sfx.flip();
        await wait(speed + 60); if (!alive) return;
      }
      msg.textContent = "Kde je Ježko? Ťukni!"; picking = true;
    }
    async function pick(o) {
      if (!picking) return;
      picking = false;
      o.el.classList.add("up");
      if (o.has) { correct++; arena.querySelector(".c").textContent = correct; msg.textContent = "Tu som! Hurá!"; sfx.star(); S.happy = clamp(S.happy + 5); }
      else { msg.textContent = "Tu nie som... Som tamto!"; sfx.no(); mounds.forEach(function (m) { if (m.has) m.el.classList.add("up"); }); }
      await wait(1600); if (!alive) return;
      if (round < 3) playRound();
      else result("🦔", correct === 3 ? "Všetky 3 správne!" : "Správne: " + correct + " z 3.", correct, gameShell, openGames);
    }
    panel.cleanup = function () { alive = false; };
    playRound();
  }

  // ================= TRIPS =================
  function openMap() {
    if (!panel) openScreen("Výlet");
    setTitle("Výlet: kam pôjdeme?"); resetBody(true);
    var map = document.createElement("div"); map.className = "map";
    var pts = PLACES.map(function (p) { return p.x + "," + p.y; }).join(" ");
    map.innerHTML = '<svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="#fffaf0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="' + pts + '" fill="none" stroke="#c99a63" stroke-width="1.6" stroke-dasharray="2 2.2" stroke-linecap="round"/></svg>';
    var lastPlace = PLACES[0];
    PLACES.forEach(function (p, i) {
      var open = placeUnlocked(i);
      if (open && S.visited[p.id]) lastPlace = p;
      var b = document.createElement("button"); b.type = "button"; b.className = "node" + (open ? "" : " locked");
      b.style.left = p.x + "%"; b.style.top = p.y + "%";
      b.innerHTML = '<span class="dot"></span><span class="nm"></span>' + (open ? '<span class="cnt">' + placeCount(p) + "/5</span>" : "");
      b.querySelector(".dot").textContent = open ? p.icon : "🔒";
      b.querySelector(".nm").textContent = p.name;
      b.addEventListener("click", function () {
        if (!open) { sfx.no(); toast("Najprv nájdi 2 veci v mieste " + PLACES[i - 1].name + ".", 3000); return; }
        if (S.energy < 25) { sfx.no(); toast("Ježko je unavený. Najprv spinkať! 🌙", 3000); return; }
        if (S.hunger < 25) { sfx.no(); toast("Ježko je hladný. Najprv papať! 🍎", 3000); return; }
        sfx.step();
        var mh = map.querySelector(".map-hog"); mh.style.left = p.x + "%"; mh.style.top = p.y + "%";
        setTimeout(function () { if (panel) openPlace(p); }, 650);
      });
      map.appendChild(b);
    });
    var mh = document.createElement("div"); mh.className = "map-hog"; mh.innerHTML = miniHog();
    mh.style.left = lastPlace.x + "%"; mh.style.top = lastPlace.y + "%";
    map.appendChild(mh);
    panel.body.appendChild(map);
    toast(S.energy < 25 ? "Ježko je unavený, najprv spinkať." : S.hunger < 25 ? "Ježko je hladný, najprv papať." : "Ťukni na miesto, kam pôjdeme!", 3000);
    panel.onClose = function () { say("To bol super výlet!", 3000); anim("jump"); };
  }

  function openPlace(p) {
    setTitle(p.icon + " " + p.name); resetBody(true); extraBtn("🗺️ Mapa", openMap);
    S.energy = clamp(S.energy - 12); S.hunger = clamp(S.hunger - 8); S.happy = clamp(S.happy + 8);
    S.visited[p.id] = true; save(); render();
    var place = document.createElement("div"); place.className = "place"; place.style.background = p.bg;
    var cnt = document.createElement("div"); cnt.className = "gstat"; place.appendChild(cnt);
    function updCount() { cnt.textContent = "Nálezy " + placeCount(p) + "/5"; }
    updCount();
    // 8 hiding spots: up to 3 finds (new ones first), 1 snack, the rest empty
    var unfound = [], found = [];
    for (var i = 0; i < 5; i++) (S.finds[findId(p, i)] ? found : unfound).push(i);
    var picks = shuffle(unfound).concat(shuffle(found)).slice(0, 3);
    var contents = picks.map(function (i) { return { find: i }; }).concat([{ snack: true }, {}, {}, {}, {}]);
    contents = shuffle(contents);
    var walker = document.createElement("div"); walker.className = "walker"; walker.style.left = "50%";
    walker.innerHTML = '<div class="flip">' + miniHog() + '</div>';
    var wx = 50, busy = false, left = 8;
    var cols = [13, 38, 62, 87], rows = [34, 60];
    contents.forEach(function (c, idx) {
      var x = cols[idx % 4] + (Math.random() * 8 - 4), y = rows[Math.floor(idx / 4)] + (Math.random() * 8 - 4);
      var b = document.createElement("button"); b.type = "button"; b.className = "spot";
      b.textContent = p.covers[idx % p.covers.length]; b.setAttribute("aria-label", "Hľadať tu");
      b.style.left = x + "%"; b.style.top = y + "%";
      b.addEventListener("click", function () {
        if (busy || b.classList.contains("searched")) return;
        busy = true;
        walker.classList.toggle("left", x < wx); wx = x;
        walker.style.left = x + "%";
        walker.classList.remove("step"); void walker.offsetWidth; walker.classList.add("step");
        sfx.step();
        setTimeout(function () {
          if (!panel) return;
          b.classList.add("shake");
          setTimeout(function () {
            if (!panel) return;
            b.classList.remove("shake"); b.classList.add("searched"); busy = false; left--;
            var pop = document.createElement("div"); pop.className = "found"; pop.style.left = x + "%"; pop.style.top = (y - 8) + "%";
            if (c.find !== undefined) {
              var f = p.finds[c.find], id = findId(p, c.find);
              pop.textContent = f[0];
              if (!S.finds[id]) {
                S.finds[id] = true; updCount();
                toast("Nový nález: " + f[1] + "! Ide do zbierky 📒", 3000);
                giveStar(1);
                if (placeCount(p) === 5) setTimeout(function () { toast("Máš celú zbierku z miesta " + p.name + "! +3 ⭐", 4000); confetti(); giveStar(3); }, 1200);
                var nextI = PLACES.indexOf(p) + 1;
                if (placeCount(p) === 2 && PLACES[nextI]) setTimeout(function () { toast("Na mape sa otvorilo nové miesto: " + PLACES[nextI].name + "!", 3500); }, 1400);
              } else { toast(f[1] + " – ten už máme v zbierke.", 2200); sfx.pop(); }
            } else if (c.snack) {
              pop.textContent = "🍎"; S.hunger = clamp(S.hunger + 10); sfx.eat();
              toast("Ježko našiel jabĺčko a zjedol ho! Mňam!", 2500);
            } else {
              pop.textContent = "💨"; toast(["Nič tu nie je.", "Tu je len lístie.", "Prázdno! Skús inde."][rnd(3)], 1800);
            }
            place.appendChild(pop); setTimeout(function () { pop.remove(); }, 1700);
            render(); save();
            if (left === 0) setTimeout(function () { if (panel) toast("Všetko sme prehľadali! Choď na 🗺️ Mapu.", 0); }, 2000);
          }, 800);
        }, 650);
      });
      place.appendChild(b);
    });
    place.appendChild(walker);
    panel.body.appendChild(place);
    toast("Ťukaj na kríky a kamene a hľadaj poklady!", 3000);
  }

  // ================= ALBUM =================
  function openAlbum() {
    openScreen("Zbierka " + totalFinds() + "/" + PLACES.length * 5);
    resetBody(false);
    PLACES.forEach(function (p, pi) {
      var sec = document.createElement("div"); sec.className = "album-sec";
      sec.innerHTML = "<h3></h3>";
      sec.querySelector("h3").innerHTML = '<span></span><small></small>';
      sec.querySelector("h3 span").textContent = p.icon + " " + p.name;
      sec.querySelector("h3 small").textContent = placeUnlocked(pi) ? placeCount(p) + "/5" : "🔒 zatiaľ zamknuté";
      var g = document.createElement("div"); g.className = "stickers";
      p.finds.forEach(function (f, i) {
        var got = !!S.finds[findId(p, i)];
        var d = document.createElement("div"); d.className = "sticker" + (got ? " got" : "");
        d.innerHTML = '<span class="e"></span><span class="n"></span>';
        d.querySelector(".e").textContent = f[0]; d.querySelector(".n").textContent = got ? f[1] : "?";
        g.appendChild(d);
      });
      sec.appendChild(g); panel.body.appendChild(sec);
    });
  }

  // ================= BUTTONS =================
  $("btnFeed").addEventListener("click", function () { if (mode === "feed") closeTray(); else if (mode === "idle") openTray(); });
  $("btnPlay").addEventListener("click", function () {
    if (mode === "feed") closeTray();
    if (mode === "play") endPlay(); else if (mode === "idle") openGames();
  });
  $("btnBath").addEventListener("click", function () {
    if (mode === "feed") closeTray();
    if (mode === "bath") endBath(false); else if (mode === "idle") startBath();
  });
  $("btnSleep").addEventListener("click", function () {
    if (mode === "feed") closeTray();
    if (mode === "sleep") wake(false); else if (mode === "idle") startSleep();
  });
  $("btnTrip").addEventListener("click", function () {
    if (mode === "feed") closeTray();
    if (mode === "idle") openMap();
  });
  $("shopBtn").addEventListener("click", function () { if (mode === "idle" || mode === "feed") openShop(); });
  $("albumBtn").addEventListener("click", function () { if (mode === "idle" || mode === "feed") openAlbum(); });
  $("soundBtn").addEventListener("click", function () { S.sound = !S.sound; render(); save(); if (S.sound) sfx.pet(); });

  render();
  setTimeout(function () { say("Ahoj! Ja som Ježko! Postaráš sa o mňa?", 4000); }, 300);
})();
</script>
</body>
